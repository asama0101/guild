<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guild 依頼掲示板</title>
<style>

:root{--bg:#E7DEC9;--banner:#6E1B28;--banner-ink:#F0CF7A;--banner-sub:#E6C9C9;--dot:#9BE0AE;--plaque:#6E1B28;--paper:#F6EEDB;--paper2:#FCF8EC;--ink:#2B2019;--sub:#5C4A3C;--line:#CDB98A;--brass:#A8863A;--gold:#7A1E2C;--ok:#2E6B47;--ok-bg:#DDEBDD;--warn:#7D5200;--warn-bg:#F5E3B5;--ng:#B3261E;--seal:#7A1E2C;--mute:#6A5A48;--surface:#FFFDF5;--surface2:#F2E8CF;--head:#E8DBB8;--track:#E2D6B6;--grid:#E8DFC8;--sel-bg:#EDF3E6;--seal-edge:#4A0F18;--ng-edge:#5A1018;--ok-edge:#1B4630;--stop:#4A4036;--stop-line:#7A6E5E;--stop-bg:#E7DFCB;--on:#fff;--stripe1:#CDBF9C;--stripe2:#E7DFCB}
body{margin:0;background:var(--bg)}
.root{font-family:'Noto Sans JP','Yu Gothic UI','Hiragino Sans','Meiryo',sans-serif;color:var(--ink);background:var(--bg);min-height:100%;font-size:15px;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:20px 28px 56px;box-sizing:border-box}
.plaque{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;border:1px solid var(--brass);border-radius:6px;padding:12px 20px;background:var(--banner)}
.plaque h1{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:25px;margin:0;letter-spacing:.06em;color:var(--banner-ink)}
.plaque .sub2{font-size:13px;color:var(--banner-sub)}
.conn{margin-left:auto;font-size:13px;color:var(--banner-sub);display:flex;gap:8px;align-items:center}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px;border-bottom:2px solid var(--brass);position:sticky;top:0;z-index:20;background:var(--bg);padding-top:8px}
.tabs .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:4px}
.tabs .tools button{margin-bottom:0;min-height:38px;padding:4px 14px;border:1px solid var(--brass);border-radius:6px;background:var(--surface);color:var(--ink)}
.tabs .tools button.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.quick{scroll-margin-top:70px}
.tabs button{font:inherit;font-weight:700;min-height:44px;padding:6px 22px;border:1px solid var(--brass);border-bottom:0;border-radius:6px 6px 0 0;background:var(--banner);color:var(--banner-ink);cursor:pointer;margin-bottom:-2px}
.tabs button.on{background:var(--paper);color:var(--ink);border-color:var(--line)}
.panel{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:22px 26px 30px}
.attn{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--warn-bg);border:1px solid var(--warn);border-radius:6px;padding:8px 16px;margin-bottom:16px;font-size:14px}
.attn b{color:var(--warn)}
.id{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px;color:var(--sub)}
.newbtn{background:var(--seal);border-color:var(--seal-edge);color:var(--on);margin-left:auto}
.quick{background:var(--paper2);border:2px solid var(--brass);border-radius:6px;padding:14px 18px 12px;margin-bottom:16px}
.qrow{display:flex;gap:10px;align-items:stretch}
.qrow textarea{flex:1 1 auto;min-height:60px;margin:0}
.qgo{flex:0 0 96px;min-height:60px;font-size:16px}
.qmore{margin-top:10px}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 20px;align-items:start;margin-top:10px}
.saved{margin:8px 0 0;font-size:13.5px;color:var(--ok);font-weight:700}
.toastfix{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);margin:0;z-index:40;background:var(--surface);border:1px solid var(--brass);border-radius:6px;padding:8px 16px;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:90vw}
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 18px 16px;margin-bottom:16px}
.stamp{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:13px;border:2px solid;border-radius:4px;padding:0 9px;display:inline-block;white-space:nowrap;transform:rotate(-2deg)}
.sd-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.sd-ng{color:var(--ng);border-color:var(--ng)}
.sd-turn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.sd-wait{color:var(--mute);border-color:var(--mute);border-style:dashed}
.sd-stop{color:var(--stop);border-color:var(--stop-line);background:var(--stop-bg)}
.sd-draft{color:var(--sub);border-color:var(--brass);border-style:dotted}
.bar{height:9px;border:1px solid var(--line);background:var(--track);border-radius:2px;overflow:hidden;margin:4px 0 2px}
.bar span{display:block;height:100%;background:var(--ok)}
.sub{font-size:13px;color:var(--sub)}
.letter{background:var(--surface);border:2px solid var(--brass);border-radius:6px;padding:22px 26px 26px;position:relative;margin:26px 0 8px}
.seal{position:absolute;right:20px;top:-17px;width:44px;height:44px;border-radius:50%;background:var(--seal);border:3px solid var(--seal-edge);color:var(--on);display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:17px}
.kick{font-size:13px;font-weight:700;color:var(--ng)}
.letter h3{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:20px;margin:0 0 6px}
.letter p{margin:0 0 10px;font-size:14.5px}
.fine{font-size:13px;color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{min-height:46px;padding:6px 22px;border-radius:4px;font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--paper2);color:var(--ink)}
.btn.go{background:var(--ok);border-color:var(--ok-edge);color:var(--on)}
.btn.wax{background:var(--ng);border-color:var(--ng-edge);color:var(--on)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:var(--brass);color:var(--sub)}
textarea{width:100%;box-sizing:border-box;min-height:66px;border:1px solid var(--brass);border-radius:4px;padding:10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);resize:vertical}
input[type=text]{font:inherit;font-size:14px;min-height:42px;border:1px solid var(--brass);border-radius:4px;padding:6px 10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
input[type=date]{font:inherit;font-size:14px;min-height:42px;border:1px solid var(--brass);border-radius:4px;padding:6px 10px;background:var(--surface)}
.lbl{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;background:var(--surface);cursor:pointer}
.opt input{width:18px;height:18px;margin:5px 0 0;accent-color:var(--ok);flex:none}
.opt b{display:block}
.opt .d{font-size:13px;color:var(--sub);display:block}
.opt:has(input:checked){border:2px solid var(--ok);background:var(--sel-bg)}
.warnline{font-size:13px;color:var(--warn);display:block}
.sec{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:17px;margin:24px 0 10px}
.tid{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px;background:var(--ink);color:var(--paper);border-radius:3px;padding:0 7px}
.kind{font-size:12.5px;color:var(--sub)}
.lock{color:var(--ng);font-weight:700;font-size:12.5px}
details{margin-top:6px;font-size:13.5px}
summary{cursor:pointer;color:var(--sub);min-height:28px}
dl.c{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;margin:6px 0 0;padding:10px 12px;background:var(--surface2);border-radius:3px}
dl.c dt{color:var(--sub);font-size:12.5px}
dl.c dd{margin:0}
code{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px}
.kn-h{scroll-margin-top:70px}
.tree{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:3px;padding:12px 14px;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12.5px;line-height:1.7;margin:6px 0}
.bwrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 20px;align-items:start}
.bmain{min-width:0}
.toc{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;border:1px solid var(--line);background:var(--paper2);font-size:13px}
.toch{position:sticky;top:0;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper2)}
.tocb{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 10px;cursor:pointer}
.tocb:hover{background:var(--head)}
.tocb.on{background:var(--surface);font-weight:700;box-shadow:inset 4px 0 0 var(--seal)}
.tocb .id{display:block;font-weight:700}
.tocb .tt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp.sm{font-size:11px;padding:0 6px;border-width:1px;transform:none;font-weight:700}
@media (max-width:900px){.bwrap{display:block}.toc{display:none}}
/* 画面が広いとき（本文1100px＋左右の余白に目次が入る幅）は、目次を本文の外の左の余白に固定する */
@media (min-width:1540px){.bwrap{display:block}.toc{position:fixed;top:70px;left:calc(50% - 760px);width:190px;max-height:calc(100vh - 90px)}}
.grid2{column-count:2;column-gap:16px}
.grid2>.card{break-inside:avoid;margin:0 0 16px}
@media (max-width:900px){.grid2{column-count:1}}
.role{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 18px;padding:12px 0;border-top:1px dotted var(--brass)}
.role:first-of-type{border-top:0}
.role .nm{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:16px}
.role .md{font-size:12.5px;line-height:1.5}
.role .when{font-size:12.5px;color:var(--sub)}
@media (max-width:620px){.role{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 22px}
.card h3{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:17px;margin:0 0 8px}
.card ol{margin:0;padding-left:22px;font-size:14.5px}
.card ol li{margin-bottom:6px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:14px}
.card dl.h{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;font-size:14px}
.card dl.h dt{font-weight:700;font-size:13.5px}
.card dl.h dd{margin:0}
.faq summary{font-weight:700;color:var(--ink);font-size:14.5px}
.faq p{margin:4px 0 12px 4px;font-size:14px}

.sd-run{color:var(--sub);border-color:var(--brass);background:var(--surface2)}
.letter.danger{border-color:var(--ng)}
.letter.done{border-color:var(--ok)}
.letter.sentbox{border-color:var(--ok)}
.seal.ok{background:var(--ok);border-color:var(--ok-edge)}
.seal.ng{background:var(--ng);border-color:var(--ng-edge)}
.h2{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN',serif;font-size:20px;margin:0 0 2px}
.err{color:var(--ng);font-size:13.5px;font-weight:700;margin:8px 0 0}
.linkbtn{font:inherit;font-size:13.5px;min-height:34px;border:0;background:transparent;color:var(--gold);text-decoration:underline;cursor:pointer;padding:0 6px}
.reader{position:fixed;inset:0;background:rgba(20,10,10,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.rbox{overscroll-behavior:contain;background:var(--paper2);border:2px solid var(--brass);border-radius:6px;max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:16px 20px}
.flist{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.flist li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--grid)}
.flist li:last-child{border-bottom:0}
.flist a{color:var(--ink);font-weight:700;word-break:break-all}
.flist .acts{display:flex;gap:6px;flex-shrink:0}
.btn.sm{min-height:34px;padding:3px 14px;font-size:13px;border-width:1px}
select{font:inherit;font-size:14px;min-height:42px;border:1px solid var(--brass);border-radius:4px;padding:6px 10px;background:var(--surface);color:var(--ink);max-width:100%}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>.cap{font-weight:700;font-size:13px}
.filebtn{position:relative;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.dz{display:flex;width:100%;justify-content:center;text-align:center;border:2px dashed var(--brass);border-radius:6px;background:var(--surface2);padding:18px 14px;min-height:72px;box-sizing:border-box;transition:background .15s,border-color .15s}
.dz:hover{background:var(--head)}
.dz.over{border-color:var(--ok);background:var(--sel-bg)}
.dzmsg{font-size:14px;color:var(--sub)}
.dzlink{font-size:14px;font-weight:700;color:var(--gold);text-decoration:underline}
.filebtn:focus-within .dzlink{outline:3px solid var(--brass);outline-offset:2px}
.ff{display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipx{margin-left:6px;border:0;background:transparent;color:var(--sub);font:inherit;cursor:pointer;padding:0 2px}
.chipx:hover{color:var(--ng)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.filebtn .btn{display:inline-flex;align-items:center;box-sizing:border-box;min-height:34px;line-height:1.2}
.fld.wide{grid-column:1/-1}
.filebtn:focus-within .btn{outline:3px solid var(--brass);outline-offset:1px}
.chip{display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-size:13px;word-break:break-all}
.rhead{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.rbox pre{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:4px;padding:12px;font-size:13px;margin:0 0 8px}
input[type=file]{font:inherit;font-size:13.5px;max-width:100%}
.connbox{margin-bottom:16px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.qa{margin:16px 0 4px;padding-top:6px;border-top:1px dashed var(--line)}
.qa:first-of-type{border-top:0}

.ganttbox{box-sizing:border-box;overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper2);padding:6px}
svg.gantt{display:block;min-width:720px;max-width:100%}
svg.gantt:not(.humbars){width:100%}
svg.humbars{min-width:0;max-width:100%}
.plegend .lg{margin-right:12px;font-size:13px;white-space:nowrap}
/* クエスト掲示板：左に一覧、右に詳細パネル。狭い画面（760px 未満）では、一覧と詳細を切り替える（S.pane） */
.wrap.wide{max-width:1400px}
.qb{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:18px;align-items:start}
.qb.nolist{grid-template-columns:minmax(0,1fr)}
.qb.nolist .qlist{display:none}
.qlist{display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:70px;max-height:calc(100vh - 90px)}
.qlhead{display:flex;align-items:center;gap:10px}
.qsearch{width:100%;box-sizing:border-box;min-height:40px;padding:6px 12px;font:inherit;font-size:14px;border:1px solid var(--brass);border-radius:4px;background:var(--surface);color:var(--ink)}
.chipbar{display:flex;flex-wrap:wrap;gap:6px}
.chipbar button{font:inherit;font-size:13px;min-height:34px;border:1px solid var(--brass);border-radius:999px;padding:2px 12px;background:var(--paper2);color:var(--ink);cursor:pointer}
.chipbar button[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:var(--on)}
.chipbar .n{margin-left:6px;font-size:12px;opacity:.85}
.qrows{flex:1 1 auto;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper2)}
.qli{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 10px;width:100%;box-sizing:border-box;padding:8px 12px;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;background:transparent;text-align:left;font:inherit;font-size:13.5px;line-height:1.5;color:inherit;cursor:pointer}
.qli:hover{background:var(--surface)}
.qli[aria-current="true"]{background:var(--surface);border-left-color:var(--seal)}
.qli[aria-current="true"] .tt{font-weight:700}
.qli .id{grid-column:1;grid-row:1}
.qli .tt{grid-column:2;grid-row:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qli .st{grid-column:3;grid-row:1;text-align:right}
.qli .pg{grid-column:2;grid-row:2;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.qli .pg .bar{flex:1 1 auto;margin:0;max-width:160px}
.qli .du{grid-column:3;grid-row:2;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.qli .du.late{color:var(--ng);font-weight:700}
.qli.req{cursor:default;background:var(--surface2)}
.qfold{display:block;width:100%;font:inherit;font-size:13px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--sub);padding:8px 12px;cursor:pointer;text-align:left}
.qpanel{min-width:0;container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 20px 24px}
.qtool{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:10px;border-bottom:1px dotted var(--brass);margin-bottom:12px}
.hidebar{display:flex;flex:1 1 auto;flex-wrap:wrap;align-items:center;gap:8px 10px}
.hidebar .qsearch{width:auto;flex:0 1 240px;min-height:36px}
.qhead h3{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:20px;margin:4px 0}
.qhl{display:flex;align-items:center;gap:10px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--sub)}
.qmeta .bar{width:160px;margin:0}
.qback{display:none}
@media (max-width:760px){
  .qb,.qb.nolist{grid-template-columns:minmax(0,1fr)}
  .qlist{position:static;max-height:none}
  .qb.pane-list .qlist{display:flex}
  .qb.pane-list .qpanel{display:none}
  .qb.pane-detail .qlist{display:none}
  .qhide,.hidebar{display:none}
  .qback{display:inline-flex}
}
/* 詳細パネルのタブ（道のり／日付／インプット）と、道のりの行。パネルが広いとき（一覧を隠したときなど）は、選んだ Todo の合格基準を右に出す */
.dtabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:2px solid var(--brass)}
.dtabs button{font:inherit;font-weight:700;font-size:14px;min-height:40px;padding:4px 18px;border:1px solid var(--brass);border-bottom:0;border-radius:6px 6px 0 0;background:var(--paper2);color:var(--sub);cursor:pointer;margin-bottom:-2px}
.dtabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--line)}
.dtabs .n{margin-left:6px;font-size:12px;font-weight:400}
.dpanel{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:14px 16px 18px}
.td{border:1px solid var(--line);border-left:6px solid var(--brass);border-radius:3px;background:var(--surface);margin-bottom:6px}
.td.over{border-left-color:var(--ng)}
.td.open{border-color:var(--brass)}
.tdrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto 18px;gap:4px 12px;align-items:center;width:100%;box-sizing:border-box;padding:8px 12px;border:0;background:transparent;text-align:left;font:inherit;font-size:13.5px;color:inherit;cursor:pointer}
.tdt{min-width:0}.tdt .kind{display:block;font-size:12px}.tdt b{display:block;overflow:hidden;text-overflow:ellipsis}
.tdd{font-size:12.5px;color:var(--sub);white-space:nowrap}
.tdd.late{color:var(--ng);font-weight:700}

<body>
<div class="root"><div id="app"></div></div>
<noscript>この画面は JavaScript が必要です。</noscript>
<script>
(function () {
'use strict';

// ============================================================ 道具
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'open') { if (v) e.setAttribute(k, ''); }
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
};
const code = (t) => h('code', null, t);
const pad = (n) => String(n).padStart(2, '0');
const stamp14 = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function fmtTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const now = new Date(), y = new Date(now.getTime() - 86400000);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (sameDay(d, now)) return `今日 ${hm}`;
  if (sameDay(d, y)) return `昨日 ${hm}`;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
const parseJSON = (t) => { try { return JSON.parse(t); } catch (e) { return null; } };
const isNotFound = (e) => e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError');

// ============================================================ 保存先（フォルダ）の包み
class RealFS {
  constructor(dir) { this.dir = dir; }
  async _dir(path, create) {
    let d = this.dir;
    for (const p of path.split('/').filter(Boolean)) d = await d.getDirectoryHandle(p, { create: !!create });
    return d;
  }
  async list(path) {
    let d; try { d = await this._dir(path, false); } catch (e) { if (isNotFound(e)) return []; throw e; }
    const out = [];
    for await (const [name, hd] of d.entries()) {
      if (hd.kind === 'file') { const f = await hd.getFile(); out.push({ name, kind: 'file', mtime: f.lastModified }); }
      else out.push({ name, kind: 'dir' });
    }
    return out;
  }
  async readText(path) {
    const i = path.lastIndexOf('/');
    try {
      const d = await this._dir(i < 0 ? '' : path.slice(0, i), false);
      const f = await (await d.getFileHandle(path.slice(i + 1))).getFile();
      return await f.text();
    } catch (e) { if (isNotFound(e)) return null; throw e; }
  }
  async _write(path, data) {
    const i = path.lastIndexOf('/');
    const d = await this._dir(path.slice(0, i), true);
    const w = await (await d.getFileHandle(path.slice(i + 1), { create: true })).createWritable();
    await w.write(data); await w.close();
  }
  writeText(path, text) { return this._write(path, text); }
  writeBlob(path, blob) { return this._write(path, blob); }
  async remove(path, recursive) {
    const i = path.lastIndexOf('/');
    try { const d = await this._dir(path.slice(0, i), false); await d.removeEntry(path.slice(i + 1), { recursive: !!recursive }); }
    catch (e) { if (!isNotFound(e)) throw e; }
  }
}

// 見本・テスト用の、メモリ上の保存先
class MemFS {
  constructor(tree) { this.root = tree || {}; }
  _node(path, create) {
    let n = this.root;
    for (const p of path.split('/').filter(Boolean)) {
      if (n.__t !== undefined) return null;
      if (!(p in n)) { if (!create) return null; n[p] = {}; }
      n = n[p];
    }
    return n;
  }
  async list(path) {
    const n = this._node(path, false); if (!n || n.__t !== undefined) return [];
    return Object.keys(n).map((name) => n[name].__t !== undefined ? { name, kind: 'file', mtime: n[name].__m } : { name, kind: 'dir' });
  }
  async readText(path) { const n = this._node(path, false); return n && n.__t !== undefined ? n.__t : null; }
  async writeText(path, text) {
    const i = path.lastIndexOf('/'); const d = this._node(path.slice(0, i), true);
    d[path.slice(i + 1)] = { __t: String(text), __m: Date.now() };
  }
  async writeBlob(path, blob) { return this.writeText(path, '(添付ファイル ' + (blob.name || '') + ')'); }
  async remove(path) { const i = path.lastIndexOf('/'); const d = this._node(path.slice(0, i), false); if (d) delete d[path.slice(i + 1)]; }
}

// 論理パス（画面の中で使う Q001/… requests/… web/… archive/inbox/…）を、guild/ の中の物理パスに写す。
// 機械用のファイルは guild/.work/ にある（Obsidian に出ない）。archive/ の項目、deliverables/、inputs/ はそのまま。
const PHYS = [[/^archive\/inbox(?=\/|$)/, '.work/archive-inbox'], [/^(Q\d+|requests|web)(?=\/|$)/, '.work/$1']];
function physical(p) { for (const [re, to] of PHYS) if (re.test(p)) return p.replace(re, to); return p; }
class PathMap {
  constructor(fs) { this.fs = fs; }
  list(p) { return this.fs.list(physical(p)); }
  readText(p) { return this.fs.readText(physical(p)); }
  writeText(p, t) { return this.fs.writeText(physical(p), t); }
  writeBlob(p, b) { return this.fs.writeBlob(physical(p), b); }
  remove(p, r) { return this.fs.remove(physical(p), r); }
}
const DB = {
  // 前に作られた同名のデータベースに、必要な入れ物（object store）が無いことがある。そのときは作り直す。
  async open() {
    const once = () => new Promise((res, rej) => { const r = indexedDB.open('guild-board-handles', 1); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('h')) r.result.createObjectStore('h'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    let db = await once();
    if (!db.objectStoreNames.contains('h')) {
      db.close();
      await new Promise((res, rej) => { const d = indexedDB.deleteDatabase('guild-board-handles'); d.onsuccess = res; d.onerror = () => rej(d.error); d.onblocked = res; });
      db = await once();
    }
    return db;
  },
  async get() { const db = await DB.open(); return new Promise((res, rej) => { const r = db.transaction('h').objectStore('h').get('dir'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(v) { const db = await DB.open(); return new Promise((res, rej) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(v, 'dir'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
};

// 書庫の種類。[type, 見出し]（フォルダは分けない。種類は項目の type で持つ）
const ARCH_TYPES = [['term', '用語'], ['flow', '業務フロー'], ['fact', '業務情報'], ['personal', '個人'], ['lesson', '心得']];
const CONF = { confirmed: ['確認済み', 'sd-ok'], sourced: ['出典あり', 'sd-run'], guess: ['推測', 'sd-draft'] };
function parseEntry(path, text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text || '');
  if (!m) return null;
  const e = { path, body: m[2].trim() };
  const val = (v) => { if (/^["[]/.test(v)) { try { return JSON.parse(v); } catch (_) { /* そのまま使う */ } } return v; };
  for (const line of m[1].split(/\r?\n/)) { const i = line.indexOf(':'); if (i > 0) e[line.slice(0, i).trim()] = val(line.slice(i + 1).trim()); }
  e.aliases = (Array.isArray(e.aliases) ? e.aliases : []).map((x) => String(x).trim()).filter(Boolean);
  e.inputs = (Array.isArray(e.inputs) ? e.inputs : []).map((x) => String(x).trim()).filter(Boolean);  // 関係するインプットの名前。aliases と同じ形（ない古い項目は空）
  e.status = e.status || 'active';
  return e;
}
const HANDOFF = '送りました。/guild:quest が動いていれば、すぐ読み取って進みます。動いていなければ、チャットで /guild:quest と送ってください。';

// ============================================================ 状態
const S = {
  fs: null, conn: 'none', connMsg: '', demo: false,
  composing: false, lastInput: 0, confirm: {},
  tab: 'board', sel: null, listOpen: true, pane: 'list', bfilter: 'all', showClosed: false, newOpen: false, dtab: 'way', openTodo: null, rcache: {}, prog: { sel: null, open: false }, kn: { cur: null },
  data: null, dataKey: '', form: {}, files: {}, open: {}, sent: {}, toast: '', fallback: null, reader: null, busy: false
};

// ============================================================ 読み込み
async function readJSON(path) { const t = await S.fs.readText(path); return t == null ? null : parseJSON(t); }

async function listFilesDeep(path, depth) {
  const out = [];
  for (const e of await S.fs.list(path)) {
    if (e.kind === 'file') out.push(path ? `${path}/${e.name}` : e.name);
    else if (depth > 0) out.push(...await listFilesDeep(`${path}/${e.name}`, depth - 1));
  }
  return out.sort();
}

async function loadAll() {
  const cfg = await readJSON('config.json');
  const top = await S.fs.list('.work');
  const requests = [];
  for (const e of await S.fs.list('requests')) {
    if (e.kind === 'file' && /^R[0-9][0-9-]*\.json$/.test(e.name)) {
      const r = await readJSON(`requests/${e.name}`);
      if (r) requests.push({ id: e.name.slice(0, -5), text: r.text || '', start: r.start || null, due: r.due || null, inputs: Array.isArray(r.inputs) ? r.inputs : [], files: r.files || [], created: r.created || '' });
    }
  }
  requests.sort((a, b) => a.id.localeCompare(b.id));
  const quests = [];
  const delivFiles = (await S.fs.list('deliverables')).filter((x) => x.kind === 'file' && x.name.endsWith('.md')).map((x) => x.name).sort();
  for (const e of top) {
    if (e.kind !== 'dir' || !/^Q\d+$/.test(e.name)) continue;
    const q = e.name;
    const plan = await readJSON(`${q}/plan.json`);
    const request = await readJSON(`${q}/request.json`);
    const draft = plan ? null : await readJSON(`${q}/reports/plan-draft.json`);
    const reports = (await S.fs.list(`${q}/reports`)).filter((x) => x.kind === 'file').map((x) => x.name);
    const output = await listFilesDeep(`${q}/output`, 2);
    const inbox = [];
    for (const f of await S.fs.list(`${q}/inbox`)) {
      if (f.kind === 'file' && f.name.endsWith('.json')) { const j = await readJSON(`${q}/inbox/${f.name}`); if (j) inbox.push({ type: j.type, todo: j.todo || null, choice: j.choice || null, qs: null, due: j.due === undefined ? undefined : j.due, add: Array.isArray(j.add) ? j.add : null, remove: Array.isArray(j.remove) ? j.remove : null }); }
    }
    if (!plan) for (const f of await S.fs.list(`${q}/inbox/done`)) {
      if (f.kind === 'file' && f.name.endsWith('-answers.json')) { const j = await readJSON(`${q}/inbox/done/${f.name}`); if (j && Array.isArray(j.answers)) inbox.push({ type: 'answers', todo: null, choice: null, qs: j.answers.map((a) => a.q) }); }
    }
    const archive = await readJSON(`${q}/archive.json`);
    quests.push({ id: q, plan, request, draft, reports, output, inbox, archive, published: delivFiles.filter((n) => n.startsWith(q + '_')) });
  }
  quests.sort((a, b) => b.id.localeCompare(a.id));
  const archive = [];
  for (const f of await S.fs.list('archive')) {
    if (f.kind !== 'file' || !f.name.endsWith('.md') || f.name === 'index.md') continue;
    const e = parseEntry(f.name, await S.fs.readText(`archive/${f.name}`));
    if (e) archive.push(e);
  }
  const archiveWait = (await S.fs.list('archive/inbox')).filter((x) => x.kind === 'file' && x.name.endsWith('.json')).length;
  // 反映されなかった入力の理由（guild.py が archive/inbox/rejected/ に残す）。新しい5件だけ見せる
  const archiveRejected = [];
  for (const f of (await S.fs.list('archive/inbox/rejected')).filter((x) => x.kind === 'file' && x.name.endsWith('.reason.txt')).sort((a, b) => b.name.localeCompare(a.name)).slice(0, 5)) {
    archiveRejected.push({ file: f.name.replace(/\.reason\.txt$/, ''), reason: (await S.fs.readText(`archive/inbox/rejected/${f.name}`)) || '' });
  }
  // 受け付けられなかった依頼（guild.py new が、選んだインプットがないなどの理由で .work/requests/rejected/ へ移したもの）。新しい5件
  const rejectedRequests = [];
  for (const f of (await S.fs.list('requests/rejected')).filter((x) => x.kind === 'file' && x.name.endsWith('.json.reason.txt')).sort((a, b) => b.name.localeCompare(a.name)).slice(0, 5)) {
    const id = f.name.replace(/\.json\.reason\.txt$/, ''), r = await readJSON(`requests/rejected/${id}.json`);
    rejectedRequests.push({ id, text: (r && r.text) || '', reason: (await S.fs.readText(`requests/rejected/${f.name}`)) || '' });
  }
  // 冒険者の WebFetch の許可（フックと guild.py が書く）。答えの JSON が web/inbox/ に残っている間は「送信済み」
  const wa = (await readJSON('web/access.json')) || {};
  const webList = (k) => (Array.isArray(wa[k]) ? wa[k] : []);
  const webWait = (await S.fs.list('web/inbox')).filter((x) => x.kind === 'file' && x.name.endsWith('.json')).length;
  const web = { allow: webList('allow'), once: webList('once'), denied: webList('denied'), pending: webList('pending').filter((x) => x && x.domain), wait: webWait };
  // 共通のインプット（guild/inputs/ の直下だけ。サブフォルダは見ない）。名前の同一判定は、大文字小文字を区別しない（guild.py と同じ）
  const inputs = (await S.fs.list('inputs')).filter((e) => e.kind === 'file').map((e) => ({ name: e.name, mtime: e.mtime || 0 })).sort((a, b) => a.name.localeCompare(b.name));
  return { requests, rejectedRequests, quests, archive, archiveWait, archiveRejected, web, inputs, root: (cfg && cfg.root) || '' };
}

// ============================================================ 読み解き
const TSTATE = {
  pending: ['待機', 'sd-wait'], blocked: ['止まり', 'sd-stop'], awaiting_confirm: ['確認待ち', 'sd-turn'], running: ['作業中', 'sd-run'],
  waiting_user: ['あなたの番', 'sd-turn'], review: ['鑑定中', 'sd-run'], done: ['合格', 'sd-ok'], failed: ['できず', 'sd-ng'], skipped: ['やめた', 'sd-stop']
};
const closed = (s) => s === 'done' || s === 'skipped';
// 期限は日付だけ。その日の終わり（ローカル時刻の 23:59:59.999）を過ぎたら期限切れ。済んだ Todo には付けない
const overdue = (t, nowMs) => !!t.due && !closed(t.state) && nowMs > new Date(t.due + 'T23:59:59.999').getTime();
// 日付の矛盾は警告にとどめる（遷移には使わない）。YYYY-MM-DD は文字列のまま比べられる
function dateIssues(plan, t) {
  const out = [], s = t.scheduled, d = t.due;
  if (s && plan.start && s < plan.start) out.push(`予定日が依頼の開始日（${plan.start}）より前です。`);

const DAY_MS = 86400000;
const dayNum = (s) => Math.floor(Date.parse(s + 'T00:00:00Z') / DAY_MS);
const dayStr = (n) => new Date(n * DAY_MS).toISOString().slice(0, 10);
const okDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && Number.isFinite(dayNum(s));  // 不正な日付は無視する

// 予定のモデル。計画のない依頼は載せない。includeClosed が false なら、完了・中止の依頼を除く。ids（Set か配列）があれば、その依頼だけ
function scheduleModel(quests, includeClosed, ids) {
  const rows = [], only = ids == null ? null : (ids instanceof Set ? ids : new Set(ids));
  for (const q of quests) {
    const p = q.q.plan; if (!p || !okDate(p.start)) continue;  // 開始日が不正な依頼は載せない
    const state = p.status === 'aborted' ? 'aborted' : (p.accepted ? 'done' : 'active');
    if (!includeClosed && state !== 'active') continue;
    if (only && !only.has(q.id)) continue;
    const todos = p.todos.map((t) => ({ id: t.id, title: t.title, kind: t.kind, state: t.state, scheduled: okDate(t.scheduled) ? t.scheduled : p.start, due: okDate(t.due) ? t.due : null }));
    rows.push({ id: q.id, title: q.title, start: p.start, due: okDate(p.due) ? p.due : p.start, state, done: todos.filter((t) => closed(t.state)).length, total: todos.length, todos });
  }
  rows.sort((a, b) => a.id.localeCompare(b.id));
  const days = rows.flatMap((r) => [r.start, r.due, ...r.todos.map((t) => t.scheduled)]).map(dayNum);
  const today = dayNum(localToday());  // 利用者の地方日付（UTC ではない）
  let min = days.length ? Math.min(...days, today) : today, max = days.length ? Math.max(...days, today) : today;
  min -= 1; max += 1; if (max - min < 7) max = min + 7;
  const byDay = new Map();
  for (const r of rows) for (const t of r.todos) if (t.kind === 'human') {
    const k = dayNum(t.scheduled), e = byDay.get(k) || { day: k, open: 0, done: 0 };
    if (closed(t.state)) e.done++; else e.open++;
    byDay.set(k, e);
  }
  return { rows, min, max, today, humanDays: [...byDay.values()].sort((a, b) => a.day - b.day) };
}

const SVGNS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs, ...kids) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); return e; };

const STATE_FILL = { pending: 'var(--mute)', blocked: 'var(--stop)', awaiting_confirm: 'var(--warn)', running: 'var(--brass)', waiting_user: 'var(--warn)', review: 'var(--brass)', done: 'var(--ok)', failed: 'var(--ng)', skipped: 'var(--stop)' };

function ganttSvg(m) {
  const LABEL = 210, PAD = 16, ROW = 26, HEAD = 34, W = 1000, n = m.max - m.min + 1, DW = (W - LABEL - PAD) / n;
  const x = (day) => LABEL + (day - m.min) * DW + DW / 2;
  const rows = m.rows.flatMap((r) => [{ q: r }, ...r.todos.map((t) => ({ q: r, t }))]);

  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': '依頼と Todo の予定', class: 'gantt' });
  // 罫線の数を抑える：範囲が広いほど間引く（最大およそ 300 本）
  const step = Math.max(n <= 31 ? 1 : n <= 120 ? 7 : 30, Math.ceil(n / 300));
  const every = Math.max(1, Math.ceil(60 / (step * DW)));  // ラベルは約 60px 以上あけて、おきに描く
  for (let d = m.min, k = 0; d <= m.max; d += step, k++) {
    svg.append(sv('line', { x1: x(d), x2: x(d), y1: HEAD - 6, y2: H, stroke: 'var(--line)', 'stroke-width': 1, opacity: 0.6 }));
    if (k % every === 0) svg.append(sv('text', { x: x(d), y: 16, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--sub)' }, dayStr(d).slice(n > 400 ? 0 : 5)));
  }
  if (today >= m.min && today <= m.max) svg.append(sv('line', { x1: x(today), x2: x(today), y1: HEAD - 6, y2: H, stroke: 'var(--ng)', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }), sv('text', { x: x(today), y: 30, 'text-anchor': 'middle', 'font-size': 10, fill: 'var(--ng)' }, '今日'));

    const y = HEAD + i * ROW, cy = y + ROW / 2, r = row.q;
    if (!row.t) {
      const x1 = x(dayNum(r.start)) - DW / 2, x2 = x(dayNum(r.due)) + DW / 2, w = Math.max(x2 - x1, 6), pct = r.total ? r.done / r.total : 0;
      svg.append(sv('text', { x: 4, y: cy + 4, 'font-size': 12, 'font-weight': 700, fill: 'var(--ink)' }, `${r.id} ${r.title.length > 14 ? r.title.slice(0, 14) + '…' : r.title}`),
        sv('rect', { x: x1, y: cy - 7, width: w, height: 14, rx: 3, fill: 'var(--surface2)', stroke: r.state === 'aborted' ? 'var(--stop)' : 'var(--brass)' }),

        sv('text', { x: x1 + w + 6, y: cy + 4, 'font-size': 11, fill: 'var(--sub)' }, `${r.done}/${r.total}${r.state === 'aborted' ? '（中止）' : r.state === 'done' ? '（完了）' : ''}`));
    } else {

      svg.append(sv('text', { x: 18, y: cy + 4, 'font-size': 11, fill: 'var(--sub)' }, `${t.id} ${t.kind === 'human' ? '👤 ' : ''}${t.title.length > 12 ? t.title.slice(0, 12) + '…' : t.title}`),
        sv('path', { d: `M${cx} ${cy - s} L${cx + s} ${cy} L${cx} ${cy + s} L${cx - s} ${cy} Z`, fill, stroke: late ? 'var(--ng)' : 'var(--ink)', 'stroke-width': late ? 2 : 0.6 },
          sv('title', null, `${t.id} ${t.title}\n予定日 ${t.scheduled}${t.due ? '　締切 ' + t.due : ''}\n${(TSTATE[t.state] || [t.state])[0]}`)));
    }
  });

}

function humanBars(m) {
  if (!m.humanDays.length) return h('p', { class: 'sub' }, 'あなたの実行（human）の Todo はありません。');
  const peak = Math.max(...m.humanDays.map((d) => d.open + d.done)), BW = 46, BH = 120, W = Math.max(m.humanDays.length * BW + 40, 300);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${BH + 44}`, width: Math.min(W, 1000), style: `width:${Math.min(W, 1000)}px`, role: 'img', 'aria-label': '予定日ごとのあなたの実行の件数', class: 'gantt humbars' });

// ---- クエスト進捗のフィルタ（表示するクエスト）。選んだ組み合わせは、ブラウザの保存（lsGet・lsSet）の guild.progress.sel に覚える（使えなければ毎回、既定）
const LS_PROG = 'guild.progress.sel';
const PROG_GROUPS = [['turn', 'あなたの番'], ['run', '進行中'], ['wait', '受け取り待ち'], ['done', '完了・中止']];
const planClosed = (x) => { const p = x.q.plan; return !!p && (p.status === 'aborted' || !!p.accepted); };  // scheduleModel の「完了・中止」と同じ
const progGroup = (x) => (planClosed(x) ? 'done' : boardBucket(x));
// 選べる依頼：ガントに載せられるもの（計画と正しい開始日がある）。完了・中止は includeClosed のときだけ
function progCandidates(quests, includeClosed) {
  return quests.filter((x) => x.q.plan && okDate(x.q.plan.start) && (includeClosed || !planClosed(x)));
}
// 表示する依頼の ID。sel が null（一度も選んでいない）なら、進行中のすべて。消えた ID・いま選べない ID は落とす
function progEffective(quests, sel, includeClosed) {
  const cands = progCandidates(quests, includeClosed);
  if (sel == null) return new Set(cands.filter((x) => !planClosed(x)).map((x) => x.id));
  const want = new Set(sel);
  return new Set(cands.filter((x) => want.has(x.id)).map((x) => x.id));
}
// すぐ選ぶ：run＝進行中だけ／turn＝自分の番だけ（答えていない手紙がある）／soon＝締切が近い5件（締切が正しい日付の、進行中の依頼）

  if (kind === 'turn') return act.filter((x) => x.asks.some((a) => !a.sent)).map((x) => x.id);
  if (kind === 'soon') return act.filter((x) => okDate(x.q.plan.due)).sort((a, b) => a.q.plan.due.localeCompare(b.q.plan.due) || a.id.localeCompare(b.id)).slice(0, 5).map((x) => x.id);
  return act.map((x) => x.id);
}

// ============================================================ 書き込み
function nowName(type, todo) { return `${stamp14(new Date())}-${type}${todo ? '-' + todo : ''}.json`; }
async function writeOrFallback(path, text, onOk) {
  if (S.conn !== 'ok' || !S.fs) { S.fallback = { path: `guild/${physical(path)}`, text, err: '保存先につながっていません' }; render(); return false; }
  try { await S.fs.writeText(path, text); if (onOk) onOk(); return true; }
  catch (e) { S.fallback = { path: `guild/${physical(path)}`, text, err: `${e.name || 'エラー'}：${e.message || e}` }; render(); return false; }
}
async function send(qid, obj, key) {
  const ok = await writeOrFallback(`${qid}/inbox/${nowName(obj.type, obj.todo)}`, JSON.stringify(obj, null, 2), () => { S.sent[key] = true; });
  if (ok) { await refresh(true); }
}
async function sendResult(qid, t, key) {
  const files = S.files[key] || [], names = [];
  try {
    for (const f of files) { const n = `${t.id}-${f.name}`; await S.fs.writeBlob(`${qid}/inbox/files/${n}`, f); names.push(`inbox/files/${n}`); }
  } catch (e) { S.fallback = { path: `guild/${physical(qid + '/inbox/files/')}`, text: '添付ファイルを保存できませんでした。', err: `${e.name}：${e.message}` }; render(); return; }
  await send(qid, { type: 'result', todo: t.id, ok: (S.form[key + ':ok'] || 'yes') === 'yes', note: (S.form[key + ':memo'] || '').trim(), files: names }, key);
}
// ローカルの今日（YYYY-MM-DD）。依頼の開始日の既定
function localToday() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
async function sendRequest() {
  const text = (S.form['new:text'] || '').trim();
  S.newError = ''; S.newSaved = '';
  if (!text) { S.newError = '依頼の内容を書いてください。'; render(); return; }
  if (S.conn !== 'ok') { S.newError = '保存先につながっていません。上の「フォルダを選ぶ」から選んでください。'; render(); return; }
  // 選んだ名前が、表示のあとで guild/inputs/ から消されていたら、出さずに知らせる（guild.py new も拒否する）
  const have = new Map(((S.model && S.model.inputs) || []).map((f) => [f.name.toLowerCase(), f.name]));
  const gone = (S.form['new:inputs'] || []).filter((n) => !have.has(n.toLowerCase()));
  if (gone.length) { S.form['new:inputs'] = (S.form['new:inputs'] || []).filter((n) => have.has(n.toLowerCase())); S.newError = `選んだインプットが見つかりません（削除された可能性があります）：${gone.join('、')}。選び直してください。`; render(); return; }
  const id = 'R' + stamp14(new Date()).replace(/^(\d{8})/, '$1-'), files = S.files.new || [], names = [];
  const picked = (S.form['new:inputs'] || []).map((n) => have.get(n.toLowerCase()));
  const start = S.form['new:start'] || localToday(), due = S.form['new:due'] || null;
  try {
    for (const f of files) { await S.fs.writeBlob(`requests/files/${id}/${f.name}`, f); names.push(f.name); }
    await S.fs.writeText(`requests/${id}.json`, JSON.stringify({ type: 'request', text, start, due, inputs: picked, files: names, created: new Date().toISOString() }, null, 2));
  } catch (e) { S.newError = `保存できませんでした（${e.name || 'エラー'}：${e.message || e}）。`; render(); return; }
  S.form['new:text'] = ''; S.form['new:due'] = ''; S.form['new:start'] = ''; S.form['new:inputs'] = []; S.form['f:npq'] = ''; S.files.new = []; S.newSaved = id; S.newOpen = false;
  await refresh(true);
}
async function openFile(full) {
  const t = await S.fs.readText(full);
  S.toast = ''; S.reader = { path: full, text: t == null ? '(読めませんでした)' : t }; render();
}
// パスは、プロジェクトのフォルダ（config.json の root）からのフルパスにする。root がなければ、guild/ からの位置になる
function fullPath(rel) {
  const root = S.model && S.model.root;
  if (!root) return { text: 'guild/' + physical(rel), full: false };
  const sep = root.includes('\\') ? '\\' : '/';
  return { text: [root.replace(/[\\/]+$/, ''), 'guild', ...physical(rel).split('/')].join(sep), full: true };
}
function copyPath(rel) {
  const p = fullPath(rel);
  return copyText(p.text, p.full ? 'フルパス' : 'パス（フルパスにするには、チャットで /guild:init をもう一度実行してください）');
}

  render();
}
