<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guild 依頼掲示板</title>
<style>

:root{--bg:#E7DEC9;--banner:#6E1B28;--banner-ink:#F0CF7A;--banner-sub:#E6C9C9;--dot:#9BE0AE;--plaque:#6E1B28;--paper:#F6EEDB;--paper2:#FCF8EC;--ink:#2B2019;--sub:#5C4A3C;--line:#CDB98A;--brass:#A8863A;--gold:#7A1E2C;--ok:#2E6B47;--ok-bg:#DDEBDD;--warn:#7D5200;--warn-bg:#F5E3B5;--ng:#B3261E;--seal:#7A1E2C;--mute:#6A5A48;--surface:#FFFDF5;--surface2:#F2E8CF;--head:#E8DBB8;--track:#E2D6B6;--grid:#E8DFC8;--sel-bg:#EDF3E6;--seal-edge:#4A0F18;--ng-edge:#5A1018;--ok-edge:#1B4630;--stop:#4A4036;--stop-line:#7A6E5E;--stop-bg:#E7DFCB;--on:#fff;--stripe1:#CDBF9C;--stripe2:#E7DFCB}
body{margin:0;background:var(--bg)}
.root{font-family:'Noto Sans JP','Yu Gothic UI','Hiragino Sans','Meiryo',sans-serif;color:var(--ink);background:var(--bg);min-height:100%;font-size:15px;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:20px 28px 56px;box-sizing:border-box}
.plaque{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;border:1px solid var(--brass);border-radius:6px;padding:12px 20px;background:var(--banner)}
.plaque h1{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:25px;margin:0;letter-spacing:.06em;color:var(--banner-ink)}
.plaque .sub2{font-size:13px;color:var(--banner-sub)}
.conn{margin-left:auto;font-size:13px;color:var(--banner-sub);display:flex;gap:8px;align-items:center}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px;border-bottom:2px solid var(--brass);position:sticky;top:0;z-index:20;background:var(--bg);padding-top:8px}
.tabs .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:4px}
.tabs .tools button{margin-bottom:0;min-height:38px;padding:4px 14px;border:1px solid var(--brass);border-radius:6px;background:var(--surface);color:var(--ink)}
.tabs .tools button.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.lr,.quick{scroll-margin-top:70px}
.qitem{transition:opacity .5s,background .5s}
/* 集中表示：目次などから選んだ依頼の票（行と中身）は明るいまま、ほかの票を暗く保つ。解除するまで残る */
.ledger.focusing .qitem:not(.hit){opacity:.22}
.ledger.focusing .qitem:not(.hit):hover{opacity:.6}
.qitem.hit{position:relative;z-index:2;background:var(--surface)}.qitem.hit .lr:focus-visible{outline:0}
@media (prefers-reduced-motion:reduce){.qitem{transition:none}}
.tabs button{font:inherit;font-weight:700;min-height:44px;padding:6px 22px;border:1px solid var(--brass);border-bottom:0;border-radius:6px 6px 0 0;background:var(--banner);color:var(--banner-ink);cursor:pointer;margin-bottom:-2px}
.tabs button.on{background:var(--paper);color:var(--ink);border-color:var(--line)}
.panel{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:22px 26px 30px}
.attn{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--warn-bg);border:1px solid var(--warn);border-radius:6px;padding:8px 16px;margin-bottom:16px;font-size:14px}
.attn b{color:var(--warn)}
.id{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px;color:var(--sub)}
.topline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.topline .attn{flex:1 1 320px;margin:0}
.newbtn{background:var(--seal);border-color:var(--seal-edge);color:var(--on);margin-left:auto}
.ledger{background:var(--paper2);border:1px solid var(--line);font-size:14px}
.lh,.lr{display:grid;grid-template-columns:86px minmax(0,1fr) 112px 70px 130px;gap:0 12px;padding:9px 14px;align-items:start;box-sizing:border-box;width:100%}
.lh{font-size:12px;color:var(--sub);background:var(--head);border-bottom:1px solid var(--line)}
.lr{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lr.plain{cursor:default}
.lr.sel{background:var(--surface);font-weight:700;box-shadow:inset 6px 0 0 var(--seal);border-bottom:0}
.lr:not(.plain):not(.sel):hover{background:var(--surface)}
.detail{padding:6px 24px 26px 30px;background:var(--surface);border-bottom:2px solid var(--seal)}
.quick{background:var(--paper2);border:2px solid var(--brass);border-radius:6px;padding:14px 18px 12px;margin-bottom:16px}
.qrow{display:flex;gap:10px;align-items:stretch}
.qrow textarea{flex:1 1 auto;min-height:60px;margin:0}
.qgo{flex:0 0 96px;min-height:60px;font-size:16px}
.qmore{margin-top:10px}
.qmain{grid-template-columns:repeat(auto-fit,minmax(220px,max-content));margin:12px 0 0}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 20px;align-items:start;margin-top:10px}
.saved{margin:8px 0 0;font-size:13.5px;color:var(--ok);font-weight:700}
.legend2{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--sub);margin:0 0 12px}
.legend2 .sw{display:inline-block;width:22px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 18px 16px;margin-bottom:16px}
.gantt h3{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:16px;margin:0 0 8px}
.gx{display:flex;align-items:center;gap:10px;min-height:42px}
.glab{flex:0 0 140px;line-height:1.35}
.glab b{display:block;font-size:13.5px}
.gtrack{position:relative;flex:1 1 auto;height:28px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--grid) calc(12.5% - 1px),var(--grid) 12.5%);border-radius:3px}
.gtrack.axis{height:20px;background:none}
.tick{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--sub);font-family:'JetBrains Mono',Consolas,'Courier New',monospace;white-space:nowrap}
.bar2{position:absolute;top:2px;height:24px;border-radius:3px;font-size:11.5px;line-height:24px;color:#fff;text-align:center;overflow:hidden;white-space:nowrap;box-sizing:border-box;font-weight:700;min-width:4px}
.s-adv{background:#6B5A3E}.s-cart{background:#4F6A70}.s-app{background:#5B4A6B}
.s-me{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn);line-height:20px}
.s-conf{background:var(--surface);color:var(--ng);border:2px dashed var(--ng);line-height:20px}
.s-ng{background:var(--ng)}
.s-blk{background:repeating-linear-gradient(45deg,var(--stripe1) 0 6px,var(--stripe2) 6px 12px);color:var(--stop);border:1px solid var(--stop-line);line-height:22px}
.nowline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ng)}
.qtag{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11.5px;background:var(--ink);color:var(--paper);border-radius:3px;padding:0 6px;margin-right:8px}
@media (max-width:760px){.lh{display:none}.lr{grid-template-columns:70px 1fr}}
.stamp{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:13px;border:2px solid;border-radius:4px;padding:0 9px;display:inline-block;white-space:nowrap;transform:rotate(-2deg)}
.sd-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.sd-ng{color:var(--ng);border-color:var(--ng)}
.sd-turn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.sd-wait{color:var(--mute);border-color:var(--mute);border-style:dashed}
.sd-stop{color:var(--stop);border-color:var(--stop-line);background:var(--stop-bg)}
.sd-draft{color:var(--sub);border-color:var(--brass);border-style:dotted}
.bar{height:9px;border:1px solid var(--line);background:var(--track);border-radius:2px;overflow:hidden;margin:4px 0 2px}
.bar span{display:block;height:100%;background:var(--ok)}
.sub{font-size:13px;color:var(--sub)}
.letter{background:var(--surface);border:2px solid var(--brass);border-radius:6px;padding:22px 26px 26px;position:relative;margin:26px 0 8px}
.seal{position:absolute;right:20px;top:-17px;width:44px;height:44px;border-radius:50%;background:var(--seal);border:3px solid var(--seal-edge);color:var(--on);display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:17px}
.kick{font-size:13px;font-weight:700;color:var(--ng)}
.letter h3{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:20px;margin:0 0 6px}
.letter p{margin:0 0 10px;font-size:14.5px}
.fine{font-size:13px;color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{min-height:46px;padding:6px 22px;border-radius:4px;font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--paper2);color:var(--ink)}
.btn.go{background:var(--ok);border-color:var(--ok-edge);color:var(--on)}
.btn.wax{background:var(--ng);border-color:var(--ng-edge);color:var(--on)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:var(--brass);color:var(--sub)}
textarea{width:100%;box-sizing:border-box;min-height:66px;border:1px solid var(--brass);border-radius:4px;padding:10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);resize:vertical}
input[type=text]{font:inherit;font-size:14px;min-height:42px;border:1px solid var(--brass);border-radius:4px;padding:6px 10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
input[type=date]{font:inherit;font-size:14px;min-height:42px;border:1px solid var(--brass);border-radius:4px;padding:6px 10px;background:var(--surface)}
.lbl{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;background:var(--surface);cursor:pointer}
.opt input{width:18px;height:18px;margin:5px 0 0;accent-color:var(--ok);flex:none}
.opt b{display:block}
.opt .d{font-size:13px;color:var(--sub);display:block}
.opt:has(input:checked){border:2px solid var(--ok);background:var(--sel-bg)}
.warnline{font-size:13px;color:var(--warn);display:block}
.drop{border:2px dashed var(--brass);border-radius:4px;padding:12px;text-align:center;font-size:13.5px;color:var(--sub);background:var(--surface2)}
.sec{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:17px;margin:24px 0 10px}
.tag{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brass);border-radius:3px;padding:10px 14px;margin-bottom:8px}
.duerow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:8px 0 0;padding-top:8px;border-top:1px dotted var(--brass);font-size:13px}
.duerow .dl{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800}
.duerow input[type=date]{font:inherit;font-size:13px;min-height:32px;padding:2px 8px;border:1px solid var(--brass);border-radius:3px;background:var(--paper2);color:var(--ink)}
.duerow .dwarn{flex-basis:100%;margin:0;color:var(--warn)}
.tag.over{border-left-color:var(--ng)}
.tag .row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.tid{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px;background:var(--ink);color:var(--paper);border-radius:3px;padding:0 7px}
.ttl{font-weight:700;flex:1 1 240px}
.kind{font-size:12.5px;color:var(--sub)}
.lock{color:var(--ng);font-weight:700;font-size:12.5px}
details{margin-top:6px;font-size:13.5px}
summary{cursor:pointer;color:var(--sub);min-height:28px}
dl.c{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;margin:6px 0 0;padding:10px 12px;background:var(--surface2);border-radius:3px}
dl.c dt{color:var(--sub);font-size:12.5px}
dl.c dd{margin:0}
.way{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;font-size:13px}
.way .n{border:1px solid var(--brass);border-radius:3px;padding:3px 10px;background:var(--surface)}
.way .n.h{border-style:dashed}
code{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px}
.kn-h{scroll-margin-top:70px}
.tree{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:3px;padding:12px 14px;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12.5px;line-height:1.7;margin:6px 0}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.bwrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 20px;align-items:start}
.bmain{min-width:0}
.toc{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;border:1px solid var(--line);background:var(--paper2);font-size:13px}
.toch{position:sticky;top:0;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper2)}
.tocb{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 10px;cursor:pointer}
.tocb:hover{background:var(--head)}
.tocb.need{box-shadow:inset 4px 0 0 var(--warn)}
.tocb.on{background:var(--surface);font-weight:700;box-shadow:inset 4px 0 0 var(--seal)}
.tocb .id{display:block;font-weight:700}
.tocb .tt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tocb .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stamp.sm{font-size:11px;padding:0 6px;border-width:1px;transform:none;font-weight:700}
@media (max-width:900px){.bwrap{display:block}.toc{display:none}}
/* 画面が広いとき（本文1100px＋左右の余白に目次が入る幅）は、目次を本文の外の左の余白に固定する */
@media (min-width:1540px){.bwrap{display:block}.toc{position:fixed;top:70px;left:calc(50% - 760px);width:190px;max-height:calc(100vh - 90px)}}
.fchk{display:inline-flex;align-items:center;gap:6px;font-size:13px;min-height:36px;border:1px solid var(--brass);border-radius:999px;padding:2px 12px;cursor:pointer;background:transparent}
.fchk.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.morebtn{min-height:34px}
.filters button{font:inherit;font-size:13px;min-height:36px;border:1px solid var(--brass);border-radius:999px;padding:2px 14px;background:transparent;color:var(--ink);cursor:pointer}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.msg{display:flex;gap:12px;margin-bottom:12px}
.who{flex:none;width:70px;text-align:center;font-size:11.5px;color:var(--sub);line-height:1.3}
.av{display:flex;width:42px;height:42px;margin:0 auto 4px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:16px;color:#fff}
.av.gm{background:#3D4A5C}.av.cart{background:#4F6A70}.av.adv{background:#6B5A3E}.av.app{background:#5B4A6B}.av.me{background:var(--warn)}
.bub{flex:1 1 auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 16px}
.bub time{display:block;font-size:11.5px;color:var(--sub)}
.bub p{margin:0}
.bub a{font-size:12.5px;color:var(--gold)}
.grid2{column-count:2;column-gap:16px}
.grid2>.card{break-inside:avoid;margin:0 0 16px}
@media (max-width:900px){.grid2{column-count:1}}
.role{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 18px;padding:12px 0;border-top:1px dotted var(--brass)}
.role:first-of-type{border-top:0}
.role .nm{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-weight:800;font-size:16px}
.role .md{font-size:12.5px;line-height:1.5}
.role .when{font-size:12.5px;color:var(--sub)}
@media (max-width:620px){.role{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 22px}
.card h3{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;font-size:17px;margin:0 0 8px}
.card ol{margin:0;padding-left:22px;font-size:14.5px}
.card ol li{margin-bottom:6px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:14px}
.card dl.h{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;font-size:14px}
.card dl.h dt{font-weight:700;font-size:13.5px}
.card dl.h dd{margin:0}
.faq summary{font-weight:700;color:var(--ink);font-size:14.5px}
.faq p{margin:4px 0 12px 4px;font-size:14px}

.sd-run{color:var(--sub);border-color:var(--brass);background:var(--surface2)}
.letter.danger{border-color:var(--ng)}
.letter.done{border-color:var(--ok)}
.letter.sentbox{border-color:var(--ok)}
.seal.ok{background:var(--ok);border-color:var(--ok-edge)}
.seal.ng{background:var(--ng);border-color:var(--ng-edge)}
.h2{font-family:'Shippori Mincho B1','Yu Mincho','Hiragino Mincho ProN',serif;font-size:20px;margin:0 0 2px}
.err{color:var(--ng);font-size:13.5px;font-weight:700;margin:8px 0 0}
.linkbtn{font:inherit;font-size:13.5px;min-height:34px;border:0;background:transparent;color:var(--gold);text-decoration:underline;cursor:pointer;padding:0 6px}
.reader{position:fixed;inset:0;background:rgba(20,10,10,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.rbox{overscroll-behavior:contain;background:var(--paper2);border:2px solid var(--brass);border-radius:6px;max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:16px 20px}
.flist{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.flist li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--grid)}
.flist li:last-child{border-bottom:0}
.flist a{color:var(--ink);font-weight:700;word-break:break-all}
.flist .acts{display:flex;gap:6px;flex-shrink:0}
.btn.sm{min-height:34px;padding:3px 14px;font-size:13px;border-width:1px}
select{font:inherit;font-size:14px;min-height:42px;border:1px solid var(--brass);border-radius:4px;padding:6px 10px;background:var(--surface);color:var(--ink);max-width:100%}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>.cap{font-weight:700;font-size:13px}
.filebtn{position:relative;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.dz{display:flex;width:100%;justify-content:center;text-align:center;border:2px dashed var(--brass);border-radius:6px;background:var(--surface2);padding:18px 14px;min-height:72px;box-sizing:border-box;transition:background .15s,border-color .15s}
.dz:hover{background:var(--head)}
.dz.over{border-color:var(--ok);background:var(--sel-bg)}
.dzmsg{font-size:14px;color:var(--sub)}
.dzlink{font-size:14px;font-weight:700;color:var(--gold);text-decoration:underline}
.filebtn:focus-within .dzlink{outline:3px solid var(--brass);outline-offset:2px}
.trow .ff{flex:1 1 300px}
.ff{display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipx{margin-left:6px;border:0;background:transparent;color:var(--sub);font:inherit;cursor:pointer;padding:0 2px}
.chipx:hover{color:var(--ng)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.filebtn .btn{display:inline-flex;align-items:center;box-sizing:border-box;min-height:34px;line-height:1.2}
.fld.wide{grid-column:1/-1}.trow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}.trow select{min-width:240px}

<body>
<div class="root"><div id="app"></div></div>
<noscript>この画面は JavaScript が必要です。</noscript>
<script>
(function () {
'use strict';

// ============================================================ 道具
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'open') { if (v) e.setAttribute(k, ''); }
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
};
const code = (t) => h('code', null, t);
const pad = (n) => String(n).padStart(2, '0');
const stamp14 = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function fmtTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const now = new Date(), y = new Date(now.getTime() - 86400000);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (sameDay(d, now)) return `今日 ${hm}`;
  if (sameDay(d, y)) return `昨日 ${hm}`;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
const parseJSON = (t) => { try { return JSON.parse(t); } catch (e) { return null; } };
const isNotFound = (e) => e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError');

// ============================================================ 保存先（フォルダ）の包み
class RealFS {
  constructor(dir) { this.dir = dir; }
  async _dir(path, create) {
    let d = this.dir;
    for (const p of path.split('/').filter(Boolean)) d = await d.getDirectoryHandle(p, { create: !!create });
    return d;
  }
  async list(path) {
    let d; try { d = await this._dir(path, false); } catch (e) { if (isNotFound(e)) return []; throw e; }
    const out = [];
    for await (const [name, hd] of d.entries()) {
      if (hd.kind === 'file') { const f = await hd.getFile(); out.push({ name, kind: 'file', mtime: f.lastModified }); }
      else out.push({ name, kind: 'dir' });
    }
    return out;
  }
  async readText(path) {
    const i = path.lastIndexOf('/');
    try {
      const d = await this._dir(i < 0 ? '' : path.slice(0, i), false);
      const f = await (await d.getFileHandle(path.slice(i + 1))).getFile();
      return await f.text();
    } catch (e) { if (isNotFound(e)) return null; throw e; }
  }
  async _write(path, data) {
    const i = path.lastIndexOf('/');
    const d = await this._dir(path.slice(0, i), true);
    const w = await (await d.getFileHandle(path.slice(i + 1), { create: true })).createWritable();
    await w.write(data); await w.close();
  }
  writeText(path, text) { return this._write(path, text); }
  writeBlob(path, blob) { return this._write(path, blob); }
  async remove(path, recursive) {
    const i = path.lastIndexOf('/');
    try { const d = await this._dir(path.slice(0, i), false); await d.removeEntry(path.slice(i + 1), { recursive: !!recursive }); }
    catch (e) { if (!isNotFound(e)) throw e; }
  }
}

// 見本・テスト用の、メモリ上の保存先
class MemFS {
  constructor(tree) { this.root = tree || {}; }
  _node(path, create) {
    let n = this.root;
    for (const p of path.split('/').filter(Boolean)) {
      if (n.__t !== undefined) return null;
      if (!(p in n)) { if (!create) return null; n[p] = {}; }
      n = n[p];
    }
    return n;
  }
  async list(path) {
    const n = this._node(path, false); if (!n || n.__t !== undefined) return [];
    return Object.keys(n).map((name) => n[name].__t !== undefined ? { name, kind: 'file', mtime: n[name].__m } : { name, kind: 'dir' });
  }
  async readText(path) { const n = this._node(path, false); return n && n.__t !== undefined ? n.__t : null; }
  async writeText(path, text) {
    const i = path.lastIndexOf('/'); const d = this._node(path.slice(0, i), true);
    d[path.slice(i + 1)] = { __t: String(text), __m: Date.now() };
  }
  async writeBlob(path, blob) { return this.writeText(path, '(添付ファイル ' + (blob.name || '') + ')'); }
  async remove(path) { const i = path.lastIndexOf('/'); const d = this._node(path.slice(0, i), false); if (d) delete d[path.slice(i + 1)]; }
}

const DB = {
  // 前に作られた同名のデータベースに、必要な入れ物（object store）が無いことがある。そのときは作り直す。
  async open() {
    const once = () => new Promise((res, rej) => { const r = indexedDB.open('guild-board-handles', 1); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('h')) r.result.createObjectStore('h'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    let db = await once();
    if (!db.objectStoreNames.contains('h')) {
      db.close();
      await new Promise((res, rej) => { const d = indexedDB.deleteDatabase('guild-board-handles'); d.onsuccess = res; d.onerror = () => rej(d.error); d.onblocked = res; });
      db = await once();
    }
    return db;
  },
  async get() { const db = await DB.open(); return new Promise((res, rej) => { const r = db.transaction('h').objectStore('h').get('dir'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(v) { const db = await DB.open(); return new Promise((res, rej) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(v, 'dir'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
};

// 納品物の形式。available が false のものは、まだ作れない（選べない）
const FORMATS = [
  { key: 'md', label: 'Markdown', ext: '.md', available: true },
  { key: 'docx', label: 'Word', ext: '.docx', available: false },
  { key: 'xlsx', label: 'Excel', ext: '.xlsx', available: false },
  { key: 'pptx', label: 'PowerPoint', ext: '.pptx', available: false }
];
// テンプレートは、どんな形式でも追加できる。今、中身を読んで使えるのは、文字のファイルだけ
const TEMPLATE_READABLE = ['.md', '.markdown', '.txt', '.csv'];
const tplReadable = (n) => TEMPLATE_READABLE.some((e) => String(n).toLowerCase().endsWith(e));
// 書庫の種類。[type, フォルダ, 見出し]
const ARCH_TYPES = [['term', 'terms', '用語'], ['flow', 'flows', '業務フロー'], ['fact', 'facts', '業務情報'], ['personal', 'personal', '個人'], ['lesson', 'lessons', '心得']];
const CONF = { confirmed: ['確認済み', 'sd-ok'], sourced: ['出典あり', 'sd-run'], guess: ['推測', 'sd-draft'] };
function parseEntry(path, text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text || '');
  if (!m) return null;
  const e = { path, body: m[2].trim() };
  const val = (v) => { if (/^["[]/.test(v)) { try { return JSON.parse(v); } catch (_) { /* そのまま使う */ } } return v; };
  for (const line of m[1].split(/\r?\n/)) { const i = line.indexOf(':'); if (i > 0) e[line.slice(0, i).trim()] = val(line.slice(i + 1).trim()); }
  e.aliases = (Array.isArray(e.aliases) ? e.aliases : []).map((x) => String(x).trim()).filter(Boolean);
  e.status = e.status || 'active';
  return e;
}
const HANDOFF = '送りました。/guild:quest が動いていれば、すぐ読み取って進みます。動いていなければ、チャットで /guild:quest と送ってください。';

// ============================================================ 状態
const S = {
  fs: null, conn: 'none', connMsg: '', demo: false,
  composing: false, lastInput: 0, confirm: {},
  tab: 'board', sel: null, openQ: {}, openInit: false, tq: null, role: 'all', stf: { board: {} }, kn: { cur: null }, limit: { board: 20, msg: 50 }, msgKey: '',
  data: null, dataKey: '', form: {}, files: {}, open: {}, sent: {}, toast: '', fallback: null, reader: null, busy: false
};

// ============================================================ 読み込み
async function readJSON(path) { const t = await S.fs.readText(path); return t == null ? null : parseJSON(t); }

async function listFilesDeep(path, depth) {
  const out = [];
  for (const e of await S.fs.list(path)) {
    if (e.kind === 'file') out.push(path ? `${path}/${e.name}` : e.name);
    else if (depth > 0) out.push(...await listFilesDeep(`${path}/${e.name}`, depth - 1));
  }
  return out.sort();
}

async function loadAll() {
  const cfg = await readJSON('config.json');
  const top = await S.fs.list('');
  const requests = [];
  for (const e of await S.fs.list('requests')) {
    if (e.kind === 'file' && /^R[0-9][0-9-]*\.json$/.test(e.name)) {
      const r = await readJSON(`requests/${e.name}`);
      if (r) requests.push({ id: e.name.slice(0, -5), text: r.text || '', due: r.due || null, files: r.files || [], created: r.created || '', format: r.format || 'md', template: r.template || null });
    }
  }
  requests.sort((a, b) => a.id.localeCompare(b.id));
  const quests = [];
  for (const e of top) {
    if (e.kind !== 'dir' || !/^Q\d+$/.test(e.name)) continue;
    const q = e.name;
    const plan = await readJSON(`${q}/plan.json`);
    const request = await readJSON(`${q}/request.json`);
    const draft = plan ? null : await readJSON(`${q}/reports/plan-draft.json`);
    const reports = (await S.fs.list(`${q}/reports`)).filter((x) => x.kind === 'file').map((x) => x.name);
    const output = await listFilesDeep(`${q}/output`, 2);
    const inbox = [];
    for (const f of await S.fs.list(`${q}/inbox`)) {
      if (f.kind === 'file' && f.name.endsWith('.json')) { const j = await readJSON(`${q}/inbox/${f.name}`); if (j) inbox.push({ type: j.type, todo: j.todo || null, choice: j.choice || null, qs: null, due: j.due === undefined ? undefined : j.due }); }
    }
    if (!plan) for (const f of await S.fs.list(`${q}/inbox/done`)) {
      if (f.kind === 'file' && f.name.endsWith('-answers.json')) { const j = await readJSON(`${q}/inbox/done/${f.name}`); if (j && Array.isArray(j.answers)) inbox.push({ type: 'answers', todo: null, choice: null, qs: j.answers.map((a) => a.q) }); }
    }
    const archive = await readJSON(`${q}/archive.json`);
    quests.push({ id: q, plan, request, draft, reports, output, inbox, archive });
  }
  quests.sort((a, b) => b.id.localeCompare(a.id));
  const archive = [];
  for (const [, dir] of ARCH_TYPES) for (const f of await S.fs.list(`archive/${dir}`)) {
    if (f.kind !== 'file' || !f.name.endsWith('.md')) continue;
    const e = parseEntry(`${dir}/${f.name}`, await S.fs.readText(`archive/${dir}/${f.name}`));
    if (e) archive.push(e);
  }
  const archiveWait = (await S.fs.list('archive/inbox')).filter((x) => x.kind === 'file' && x.name.endsWith('.json')).length;
  // 反映されなかった入力の理由（guild.py が archive/inbox/rejected/ に残す）。新しい5件だけ見せる
  const archiveRejected = [];
  for (const f of (await S.fs.list('archive/inbox/rejected')).filter((x) => x.kind === 'file' && x.name.endsWith('.reason.txt')).sort((a, b) => b.name.localeCompare(a.name)).slice(0, 5)) {
    archiveRejected.push({ file: f.name.replace(/\.reason\.txt$/, ''), reason: (await S.fs.readText(`archive/inbox/rejected/${f.name}`)) || '' });
  }
  // 冒険者の WebFetch の許可（フックと guild.py が書く）。答えの JSON が web/inbox/ に残っている間は「送信済み」
  const wa = (await readJSON('web/access.json')) || {};
  const webList = (k) => (Array.isArray(wa[k]) ? wa[k] : []);
  const webWait = (await S.fs.list('web/inbox')).filter((x) => x.kind === 'file' && x.name.endsWith('.json')).length;
  const web = { allow: webList('allow'), once: webList('once'), denied: webList('denied'), pending: webList('pending').filter((x) => x && x.domain), wait: webWait };
  const templates = (await S.fs.list('templates')).filter((e) => e.kind === 'file').map((e) => e.name).sort();
  return { requests, quests, archive, archiveWait, archiveRejected, web, templates, root: (cfg && cfg.root) || '' };
}

// ============================================================ 読み解き
const TSTATE = {
  pending: ['待機', 'sd-wait'], blocked: ['止まり', 'sd-stop'], awaiting_confirm: ['確認待ち', 'sd-turn'], running: ['作業中', 'sd-run'],
  waiting_user: ['あなたの番', 'sd-turn'], review: ['鑑定中', 'sd-run'], done: ['合格', 'sd-ok'], failed: ['できず', 'sd-ng'], skipped: ['やめた', 'sd-stop']
};
const closed = (s) => s === 'done' || s === 'skipped';
// 期限は日付だけ。その日の終わり（ローカル時刻の 23:59:59.999）を過ぎたら期限切れ。済んだ Todo には付けない
const overdue = (t, nowMs) => !!t.due && !closed(t.state) && nowMs > new Date(t.due + 'T23:59:59.999').getTime();

function dependents(plan, id) {
  const set = new Set([id]); let grew = true;
  while (grew) { grew = false; for (const t of plan.todos) if (!set.has(t.id) && (t.deps || []).some((d) => set.has(d))) { set.add(t.id); grew = true; } }
  set.delete(id); return plan.todos.filter((t) => set.has(t.id));
}

function derive(q) {
  const p = q.plan;
  const title = (p && p.title) || (q.request && String(q.request.text || '').split('\n')[0].slice(0, 80)) || q.id;
  const d = { id: q.id, title, asks: [], info: null, todos: [], done: 0, total: 0, finished: false, label: '', cls: '', me: '—', q };
  const inboxHas = (type, todo, choice) => q.inbox.some((x) => x.type === type && (todo == null || x.todo === todo) && (choice == null || x.choice === choice));
  if (!p) {
    const qs = q.draft && Array.isArray(q.draft.questions) ? q.draft.questions : [];
    if (qs.length) {
      d.asks.push({ kind: 'questions', key: `${q.id}:questions`, label: '質問', qs, sent: q.inbox.some((x) => x.type === 'answers' && (!x.qs || x.qs.join('|') === qs.map((y) => y.text).join('|'))) });
      d.label = d.asks[0].sent ? '分解中' : '質問あり'; d.cls = d.asks[0].sent ? 'sd-run' : 'sd-turn'; d.me = d.asks[0].sent ? '—' : '質問';
      return d;
    }
    d.label = '分解中'; d.cls = 'sd-run'; d.info = 'decomposing'; return d;
  }
  d.todos = p.todos.map((t) => {
    const st = TSTATE[t.state] || [t.state, 'sd-wait'];
    const draft = !p.approved && t.state === 'pending';
    const waitDue = q.inbox.filter((x) => x.type === 'due' && x.todo === t.id).slice(-1)[0];
    return { ...t, stamp: draft ? '案' : st[0], cls: draft ? 'sd-draft' : st[1], dueWait: waitDue ? waitDue.due : undefined };
  });
  d.total = p.todos.length; d.done = p.todos.filter((t) => closed(t.state)).length;
  d.allDone = d.total > 0 && d.done === d.total;
  d.finished = d.allDone && !!p.accepted;
  // 書庫の登録候補（依頼が完了・中止したあと、司書が出したもの）。中止された依頼でも答えられる
  if (q.archive && q.archive.status === 'proposed') d.asks.push({ kind: 'archive', key: `${q.id}:archive`, label: '書庫の登録候補', cands: q.archive.candidates || [], sent: inboxHas('archive') });
  if (p.status === 'aborted') { d.label = '中止'; d.cls = 'sd-stop'; d.info = 'aborted'; d.me = d.asks.some((a) => !a.sent) ? '書庫の登録候補' : '—'; return d; }
  if (p.status === 'replan') { d.label = '計画を直し中'; d.cls = 'sd-run'; d.info = 'replan'; return d; }
  if (!p.approved) {
    d.asks.push({ kind: 'approve', key: `${q.id}:approve`, label: '承認', sent: inboxHas('approve') || inboxHas('decision', null, 'replan') || inboxHas('decision', null, 'abort') });
  } else {
    for (const t of p.todos) {
      if (t.state === 'awaiting_confirm') d.asks.push({ kind: 'confirm', todo: t, key: `${q.id}:${t.id}:confirm`, label: `${t.id}（確認）`, sent: inboxHas('confirm', t.id) });
      if (t.state === 'waiting_user') d.asks.push({ kind: 'result', todo: t, key: `${q.id}:${t.id}:result`, label: t.id, sent: inboxHas('result', t.id) });
      if (t.state === 'failed') d.asks.push({ kind: 'decision', todo: t, key: `${q.id}:${t.id}:decision`, label: `${t.id}（判断）`, sent: inboxHas('decision', t.id) || inboxHas('decision', null, 'replan') || inboxHas('decision', null, 'abort') });
    }
  }
  if (p.approved && d.allDone && !p.accepted) d.asks.push({ kind: 'accept', key: `${q.id}:accept`, label: '受け取り', sent: inboxHas('accept') || inboxHas('decision', null, 'replan') || inboxHas('decision', null, 'abort') });
  const waiting = d.asks.filter((a) => !a.sent);
  if (d.finished) { d.label = '完了'; d.cls = 'sd-ok'; }
  else if (waiting.some((a) => a.kind === 'decision')) { d.label = '要判断'; d.cls = 'sd-ng'; }
  else if (!p.approved) { d.label = '承認待ち'; d.cls = 'sd-draft'; }
  else if (waiting.some((a) => a.kind === 'accept')) { d.label = '受け取り待ち'; d.cls = 'sd-turn'; }
  else if (waiting.length) { d.label = '進行中'; d.cls = 'sd-turn'; }
  else { d.label = '進行中'; d.cls = 'sd-run'; }
  d.me = waiting.length ? waiting.map((a) => a.label).join('・') : '—';
  if (d.finished) d.info = 'finished';
  return d;
}

function buildModel(raw) {
  const quests = raw.quests.map(derive);
  return { root: raw.root, requests: raw.requests, archive: raw.archive, archiveWait: raw.archiveWait, archiveRejected: raw.archiveRejected || [], web: raw.web || { allow: [], once: [], denied: [], pending: [], wait: 0 }, templates: raw.templates, quests, needs: quests.flatMap((x) => x.asks.filter((a) => !a.sent).map((a) => ({ q: x.id, text: `${x.id}：${askText(x, a)}` }))) };
}
function askText(x, a) {
  if (a.kind === 'approve') return '計画の承認';
  if (a.kind === 'accept') return '納品物の受け取り確認';
  if (a.kind === 'questions') return '依頼についての質問';
  if (a.kind === 'archive') return '書庫に登録する候補の確認';
  if (a.kind === 'confirm') return `${a.todo.id}「${a.todo.title}」の実行前の確認`;
  if (a.kind === 'result') return `${a.todo.id}「${a.todo.title}」`;
  return `${a.todo.id} ができなかったため、進め方の判断`;
}

// ---- 会話の材料と、タイムラインの帯
function roleOf(kind) { return { gm: ['受', 'マスター', 'gm'], cart: ['地', '地図師', 'cart'], adv: ['冒', '冒険者', 'adv'], app: ['鑑', '鑑定士', 'app'], me: ['君', 'あなた', 'me'] }[kind]; }
function messagesOf(q) {
  const p = q.q.plan; if (!p) return [];
  const has = (n) => q.q.reports.includes(n);
  const out = [];
  const kindOf = {}; p.todos.forEach((t) => { kindOf[t.id] = t.kind; });
  const add = (h0, role, text, report, note) => out.push({ q: q.id, t: h0.t, role, text, report: report && has(report.split('/').pop()) ? report : '', note: !!note });
  for (const e of p.history || []) {
    const id = e.id;
    if (e.event === 'adopted') add(e, 'cart', `${p.todos.length}つの Todo に分けました。`, 'reports/plan-draft.json');
    else if (e.event === 'approved') add(e, 'me', '計画を承認しました。');
    else if (e.event === 'accepted') add(e, 'me', '納品物を受け取りました。');
    else if (e.event === 'replanned') add(e, 'cart', `計画を作り直しました（引き継いだ Todo：${(e.carried || []).join('、') || 'なし'}）。`, 'reports/plan-draft.json');
    else if (e.event === 'decision') add(e, 'me', e.choice === 'abort' ? '依頼を中止しました。' : '計画を直すよう頼みました。' + (e.comment ? `（${e.comment}）` : ''));
    else if (e.event === 'deps_done') {
      if (e.to === 'waiting_user') add(e, 'gm', `${id} をあなたに渡しました。「掲示板」の手紙に、答える欄があります。`);
      else if (e.to === 'awaiting_confirm') add(e, 'gm', `${id} は実行前の確認待ちです。`);
      else add(e, 'gm', `${id} を冒険者に渡しました。`);
    }
    else if (e.event === 'dep_failed') add(e, 'gm', `${id} が止まりました（前提の Todo ができなかったため）。`);
    else if (e.event === 'unblock') add(e, 'gm', `${id} の止まりが解けました。`);
    else if (e.event === 'confirmed') add(e, 'me', `${id}：実行する、を選びました。`);

    else if (e.event === 'reported_failed') add(e, 'me', `${id}：できなかった。`, `reports/${id}-user.md`);
    else if (e.event === 'passed') add(e, 'app', `${id}：合格。`, `reports/${id}-appraiser.md`);
    else if (e.event === 'rejected') add(e, 'app', `${id}：不合格です。${e.to === 'failed' ? 'やり直しの回数を超えました。' : 'やり直します。'}`, `reports/${id}-appraiser.md`, true);
    else if (e.event === 'skip') add(e, 'me', `${id}：やめました。`);
    else if (e.event === 'dropped') add(e, 'gm', `${id}：前提がやめられたため、やめました。`);

}

const BARKIND = { running: ['adv', '作業'], review: ['app', '鑑定'], waiting_user: ['me', 'あなたの番'], awaiting_confirm: ['conf', '確認待ち'], blocked: ['blk', '止まり'], failed: ['ng', 'できず'] };
function ganttOf(q) {
  const p = q.q.plan; if (!p || !(p.history || []).length) return null;
  const now = Date.now(), hist = p.history.map((e) => ({ ...e, ms: new Date(e.t).getTime() })).filter((e) => !isNaN(e.ms));
  const rows = [];
  const adopted = hist.find((e) => e.event === 'adopted'), approved = hist.find((e) => e.event === 'approved');
  let lo = hist[0].ms, hi = hist[hist.length - 1].ms, open = false;
  if (adopted) {
    const end = approved ? approved.ms : now; if (!approved) open = true;
    rows.push({ label: '分解・承認', sub: '地図師／あなた', bars: [{ kind: 'me', text: '承認待ち', a: adopted.ms, b: end }] });
    hi = Math.max(hi, end);
  }
  for (const t of p.todos) {
    const ev = hist.filter((e) => e.id === t.id && e.to);
    const bars = [];
    ev.forEach((e, i) => {
      const k = BARKIND[e.to]; if (!k) return;
      const nxt = ev[i + 1]; const end = nxt ? nxt.ms : now; if (!nxt) open = true;
      bars.push({ kind: k[0], text: k[1], a: e.ms, b: end }); hi = Math.max(hi, end);
    });
    rows.push({ label: t.id, sub: t.title.length > 14 ? t.title.slice(0, 14) + '…' : t.title, bars });
  }
  if (open) hi = Math.max(hi, now);
  const span = Math.max(hi - lo, 60000), pad2 = span * 0.04; lo -= 0; hi += pad2;
  const steps = [1, 2, 5, 10, 15, 30, 60, 120, 180, 360, 720, 1440, 2880, 10080].map((m) => m * 60000);
  const step = steps.find((s) => (hi - lo) / s <= 8) || steps[steps.length - 1];
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  return { rows, lo, hi, ticks, now: open ? now : null, long: hi - lo > 86400000 };
}

// ============================================================ 書き込み
function nowName(type, todo) { return `${stamp14(new Date())}-${type}${todo ? '-' + todo : ''}.json`; }
async function writeOrFallback(path, text, onOk) {
  if (S.conn !== 'ok' || !S.fs) { S.fallback = { path: `guild/${path}`, text, err: '保存先につながっていません' }; render(); return false; }
  try { await S.fs.writeText(path, text); if (onOk) onOk(); return true; }
  catch (e) { S.fallback = { path: `guild/${path}`, text, err: `${e.name || 'エラー'}：${e.message || e}` }; render(); return false; }
}
async function send(qid, obj, key) {
  const ok = await writeOrFallback(`${qid}/inbox/${nowName(obj.type, obj.todo)}`, JSON.stringify(obj, null, 2), () => { S.sent[key] = true; });
  if (ok) { await refresh(true); }
}
async function sendResult(qid, t, key) {
  const files = S.files[key] || [], names = [];
  try {
    for (const f of files) { const n = `${t.id}-${f.name}`; await S.fs.writeBlob(`${qid}/inbox/files/${n}`, f); names.push(`inbox/files/${n}`); }
  } catch (e) { S.fallback = { path: `guild/${qid}/inbox/files/`, text: '添付ファイルを保存できませんでした。', err: `${e.name}：${e.message}` }; render(); return; }
  await send(qid, { type: 'result', todo: t.id, ok: (S.form[key + ':ok'] || 'yes') === 'yes', note: (S.form[key + ':memo'] || '').trim(), files: names }, key);
}
async function sendRequest() {
  const text = (S.form['new:text'] || '').trim();
  S.newError = ''; S.newSaved = ''; S.newNote = '';
  if (!text) { S.newError = '依頼の内容を書いてください。'; render(); return; }
  if (S.conn !== 'ok') { S.newError = '保存先につながっていません。上の「フォルダを選ぶ」から選んでください。'; render(); return; }
  const id = 'R' + stamp14(new Date()).replace(/^(\d{8})/, '$1-'), files = S.files.new || [], names = [];
  const fmtKey = S.form['new:format'] || 'md';
  const tfile = (S.files.newtpl || [])[0];
  let template = S.form['new:template'] || null;
  try {
    if (tfile) {
      const have = (S.model && S.model.templates) || [];
      let tn = tfile.name; if (have.includes(tn)) tn = tn.replace(/(\.[^.]*)?$/, `-${stamp14(new Date())}$1`);
      await S.fs.writeBlob(`templates/${tn}`, tfile); template = tplReadable(tn) ? `templates/${tn}` : null;
      if (!template) S.newNote = `テンプレート ${tn} を保存しました。形式が今は読めないため、この依頼では使いません。`;
    }
    for (const f of files) { await S.fs.writeBlob(`requests/files/${id}/${f.name}`, f); names.push(f.name); }
    await S.fs.writeText(`requests/${id}.json`, JSON.stringify({ type: 'request', text, due: S.form['new:due'] || null, format: fmtKey, template, files: names, created: new Date().toISOString() }, null, 2));
  } catch (e) { S.newError = `保存できませんでした（${e.name || 'エラー'}：${e.message || e}）。`; render(); return; }
  S.form['new:text'] = ''; S.form['new:due'] = ''; S.form['new:template'] = ''; S.files.new = []; S.files.newtpl = []; S.newSaved = id;
  await refresh(true);
}

// パスは、プロジェクトのフォルダ（config.json の root）からのフルパスにする。root がなければ、guild/ からの位置になる
function fullPath(rel) {
  const root = S.model && S.model.root;
  if (!root) return { text: 'guild/' + rel, full: false };
  const sep = root.includes('\\') ? '\\' : '/';
  return { text: [root.replace(/[\\/]+$/, ''), 'guild', ...rel.split('/')].join(sep), full: true };
}

function isEditing() {
  if (S.composing) return true;
  const ae = document.activeElement;
  const field = ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'radio' && ae.type !== 'checkbox' && ae.type !== 'file'));
  return !!field && Date.now() - S.lastInput < 10000;
}
async function refresh(force) {
  if (S.conn !== 'ok' || S.busy) return;
  S.busy = true;
  try {
    const raw = await loadAll(); const key = JSON.stringify(raw);
    // 入力中（変換中を含む）は画面を作り直さない。作り直すと、変換が確定せず、位置も動く。入力が止まった次の更新で反映する
    // 資料を開いている間も作り直さない（読んでいる位置が上に戻ってしまう）。閉じたあとの次の更新で反映する
    if (!force && key !== S.dataKey && (isEditing() || S.reader || S.fallback)) return;
    if (force || key !== S.dataKey) {
      S.dataKey = key; S.model = buildModel(raw);
      const ids = S.model.quests.map((x) => x.id);
      if (!S.openInit && ids.length) { S.openInit = true; const f0 = S.model.quests.find((x) => x.asks.some((a) => !a.sent)) || S.model.quests[0]; if (f0) S.openQ[f0.id] = true; }
      if (!S.sel || !ids.includes(S.sel)) { const first = S.model.quests.find((x) => x.asks.some((a) => !a.sent)) || S.model.quests[0]; S.sel = first ? first.id : null; }
      if (!S.tq || (S.tq !== 'all' && !ids.includes(S.tq))) S.tq = S.sel;
      render();
    }
  } catch (e) { S.connMsg = `読み込めませんでした（${e.name || 'エラー'}：${e.message || e}）。`; S.conn = 'error'; render(); }
  finally { S.busy = false; }
}
async function useHandle(handle) {
  let dir = handle;
  if (handle.name !== 'guild') {
    try { dir = await handle.getDirectoryHandle('guild'); }
    catch (e) { S.conn = 'none'; S.connMsg = `選んだフォルダに guild/ がありません。チャットで /guild:init を先に実行してください。（選んだ場所：${handle.name}）`; render(); return false; }
  }
  S.fs = new RealFS(dir); S.conn = 'ok'; S.connMsg = ''; S.dataKey = ''; await refresh(true); return true;
}
async function pickFolder() {
  try {
    const handle = await window.showDirectoryPicker({ id: 'guild-folder', mode: 'readwrite' });
    S.handle = handle;
    if (await useHandle(handle)) {
      try { await DB.put(handle); } catch (e) { S.connMsg = `フォルダは使えますが、次回のために覚えておけませんでした（${e.name || 'エラー'}：${e.message || e}）。次に開いたとき、もう一度選んでください。`; render(); }
    }
  } catch (e) { if (e && e.name === 'AbortError') return; S.connMsg = `フォルダを選べませんでした（${e.name || 'エラー'}：${e.message || e}）。`; render(); }
}
async function reconnect() {
  try {
    const perm = await S.handle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') await useHandle(S.handle); else { S.connMsg = '許可されませんでした。「フォルダを選ぶ」から選び直してください。'; render(); }
  } catch (e) { S.connMsg = `許可を求められませんでした（${e.name || 'エラー'}：${e.message || e}）。`; render(); }
}

    Q001: { ...(scene === 'archive' ? { 'archive.json': J({ status: 'proposed', registered: [], decided: {}, candidates: [{ id: 'C1', type: 'term', name: 'digest', aliases: [], summary: '要点を3行にまとめた資料', body: '社内では、notes.txt の要点を3行にしたものをこう呼ぶ。', confidence: 'sourced', source: 'Q001/output/T1/digest.md' }, { id: 'C2', type: 'fact', name: '公開の了承者', aliases: [], summary: '上司の了承が要る', body: '公開前に上司の口頭の了承をもらう。', confidence: 'guess', source: '', update_of: 'facts/公開の了承者.md', conflict: true }] }) } : {}), 'plan.json': J(p1), 'request.json': J({ text: 'notes.txt の要点を3行にまとめて、上司の了承をもらったあとで公開したい' }), reports: rep, output: { T1: { 'digest.md': T('- 見本') }, T3: { '公開用まとめ.md': T('# 見本の資料 - 結論から書く') } }, inbox: {} },

}

// ============================================================ 起動
async function start() {
  try { history.scrollRestoration = 'manual'; } catch (e) { /* 使えなくても続ける */ }
  const params = new URLSearchParams(location.search);
  for (const ev of ['dragover', 'drop']) document.addEventListener(ev, (e) => { if (!e.target.closest || !e.target.closest('.dz')) e.preventDefault(); });
  window.addEventListener('scroll', spyKn, { passive: true });
  // 集中表示は、票の外をクリックすると解除する（目次と「あなたの番」の帯は、押した依頼へ移るので除く）。再描画はせず、見た目だけをその場で戻す
  document.addEventListener('click', (e) => {
    if (!S.focusQ || !(e.target instanceof Element) || e.target.closest('.qitem.hit, .tocb, .attn')) return;
    S.focusQ = null;
    document.querySelectorAll('.ledger.focusing').forEach((x) => x.classList.remove('focusing'));
    document.querySelectorAll('.qitem.hit').forEach((x) => x.classList.remove('hit'));
  }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.focusQ && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) { S.focusQ = null; render(); } });
  document.addEventListener('compositionstart', () => { S.composing = true; });
  document.addEventListener('compositionend', () => { S.composing = false; S.lastInput = Date.now(); const k = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.key; if (k && k.startsWith('f:')) { S.form[k] = document.activeElement.value; render(); } });
  document.addEventListener('input', (e) => {
    S.lastInput = Date.now();
    const k = e.target.dataset && e.target.dataset.key;
    if (k && e.target.type !== 'radio' && e.target.type !== 'checkbox') S.form[k] = e.target.value;
    if (k === 'new:format' || (k && k.startsWith('f:') && !S.composing)) render();
  });
  document.addEventListener('change', (e) => {
    const t = e.target, k = t.dataset && t.dataset.key;
    if (k && t.type === 'radio') S.form[k] = t.value;
    if (k && t.type === 'checkbox') S.form[k] = Array.from(document.querySelectorAll('input[type=checkbox]')).filter((c) => c.dataset.key === k && c.checked).map((c) => c.value);
    if (k && t.type === 'date') S.form[k] = t.value;
  });
  window.__guildBoard = { S, render, refresh, MemFS, useFS: async (fs, demo) => { S.fs = fs; S.conn = 'ok'; S.demo = !!demo; S.dataKey = ''; await refresh(true); } };
  if (params.has('demo')) {
    S.demo = true; S.fs = new MemFS(demoTree(params.get('demo') || 'human')); S.conn = 'ok'; await refresh(true); return;
  }
  if (!window.showDirectoryPicker) { S.conn = 'unsupported'; render(); return; }
  render();
  try {
    const handle = await DB.get();
    if (handle) {
      S.handle = handle;
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') await useHandle(handle); else { S.conn = 'need-permission'; render(); }
    }
  } catch (e) { S.connMsg = `前に選んだフォルダを読み出せませんでした（${e.name || 'エラー'}：${e.message || e}）。`; render(); }
  setInterval(() => { if (!document.hidden) refresh(false); }, 3000);
}
start();
})();
