<script>
(function () {
'use strict';

// ============================================================ 道具
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'open') { if (v) e.setAttribute(k, ''); }
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
};
const code = (t) => h('code', null, t);
const pad = (n) => String(n).padStart(2, '0');
const stamp14 = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function fmtTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const now = new Date(), y = new Date(now.getTime() - 86400000);
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (sameDay(d, now)) return `今日 ${hm}`;
  if (sameDay(d, y)) return `昨日 ${hm}`;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
const parseJSON = (t) => { try { return JSON.parse(t); } catch (e) { return null; } };
const isNotFound = (e) => e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError');

// ============================================================ 保存先（フォルダ）の包み
class RealFS {
  constructor(dir) { this.dir = dir; }
  async _dir(path, create) {
    let d = this.dir;
    for (const p of path.split('/').filter(Boolean)) d = await d.getDirectoryHandle(p, { create: !!create });
    return d;
  }
  async list(path) {
    let d; try { d = await this._dir(path, false); } catch (e) { if (isNotFound(e)) return []; throw e; }
    const out = [];
    for await (const [name, hd] of d.entries()) {
      if (hd.kind === 'file') { const f = await hd.getFile(); out.push({ name, kind: 'file', mtime: f.lastModified }); }
      else out.push({ name, kind: 'dir' });
    }
    return out;
  }
  async readText(path) {
    const i = path.lastIndexOf('/');
    try {
      const d = await this._dir(path.slice(0, i), false);
      const f = await (await d.getFileHandle(path.slice(i + 1))).getFile();
      return await f.text();
    } catch (e) { if (isNotFound(e)) return null; throw e; }
  }
  async _write(path, data) {
    const i = path.lastIndexOf('/');
    const d = await this._dir(path.slice(0, i), true);
    const w = await (await d.getFileHandle(path.slice(i + 1), { create: true })).createWritable();
    await w.write(data); await w.close();
  }
  writeText(path, text) { return this._write(path, text); }
  writeBlob(path, blob) { return this._write(path, blob); }
  async remove(path, recursive) {
    const i = path.lastIndexOf('/');
    try { const d = await this._dir(path.slice(0, i), false); await d.removeEntry(path.slice(i + 1), { recursive: !!recursive }); }
    catch (e) { if (!isNotFound(e)) throw e; }
  }
}

// 見本・テスト用の、メモリ上の保存先
class MemFS {
  constructor(tree) { this.root = tree || {}; }
  _node(path, create) {
    let n = this.root;
    for (const p of path.split('/').filter(Boolean)) {
      if (n.__t !== undefined) return null;
      if (!(p in n)) { if (!create) return null; n[p] = {}; }
      n = n[p];
    }
    return n;
  }
  async list(path) {
    const n = this._node(path, false); if (!n || n.__t !== undefined) return [];
    return Object.keys(n).map((name) => n[name].__t !== undefined ? { name, kind: 'file', mtime: n[name].__m } : { name, kind: 'dir' });
  }
  async readText(path) { const n = this._node(path, false); return n && n.__t !== undefined ? n.__t : null; }
  async writeText(path, text) {
    const i = path.lastIndexOf('/'); const d = this._node(path.slice(0, i), true);
    d[path.slice(i + 1)] = { __t: String(text), __m: Date.now() };
  }
  async writeBlob(path, blob) { return this.writeText(path, '(添付ファイル ' + (blob.name || '') + ')'); }
  async remove(path) { const i = path.lastIndexOf('/'); const d = this._node(path.slice(0, i), false); if (d) delete d[path.slice(i + 1)]; }
}

const DB = {
  // 前に作られた同名のデータベースに、必要な入れ物（object store）が無いことがある。そのときは作り直す。
  async open() {
    const once = () => new Promise((res, rej) => { const r = indexedDB.open('guild-board-handles', 1); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('h')) r.result.createObjectStore('h'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    let db = await once();
    if (!db.objectStoreNames.contains('h')) {
      db.close();
      await new Promise((res, rej) => { const d = indexedDB.deleteDatabase('guild-board-handles'); d.onsuccess = res; d.onerror = () => rej(d.error); d.onblocked = res; });
      db = await once();
    }
    return db;
  },
  async get() { const db = await DB.open(); return new Promise((res, rej) => { const r = db.transaction('h').objectStore('h').get('dir'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(v) { const db = await DB.open(); return new Promise((res, rej) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(v, 'dir'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
};

// ============================================================ 読み込み
async function readJSON(path) { const t = await S.fs.readText(path); return t == null ? null : parseJSON(t); }

async function listFilesDeep(path, depth) {
  const out = [];
  for (const e of await S.fs.list(path)) {
    if (e.kind === 'file') out.push(path ? `${path}/${e.name}` : e.name);
    else if (depth > 0) out.push(...await listFilesDeep(`${path}/${e.name}`, depth - 1));
  }
  return out.sort();
}

async function loadAll() {
  const top = await S.fs.list('');
  const requests = [];
  for (const e of await S.fs.list('requests')) {
    if (e.kind === 'file' && /^R[0-9][0-9-]*\.json$/.test(e.name)) {
      const r = await readJSON(`requests/${e.name}`);
      if (r) requests.push({ id: e.name.slice(0, -5), text: r.text || '', due: r.due || null, files: r.files || [], created: r.created || '', format: r.format || 'md', template: r.template || null });
    }
  }
  requests.sort((a, b) => a.id.localeCompare(b.id));
  const quests = [];
  for (const e of top) {
    if (e.kind !== 'dir' || !/^Q\d+$/.test(e.name)) continue;
    const q = e.name;
    const plan = await readJSON(`${q}/plan.json`);
    const request = await readJSON(`${q}/request.json`);
    const draft = plan ? null : await readJSON(`${q}/reports/plan-draft.json`);
    const reports = (await S.fs.list(`${q}/reports`)).filter((x) => x.kind === 'file').map((x) => x.name);
    const output = await listFilesDeep(`${q}/output`, 2);
    const inbox = [];
    for (const f of await S.fs.list(`${q}/inbox`)) {
      if (f.kind === 'file' && f.name.endsWith('.json')) { const j = await readJSON(`${q}/inbox/${f.name}`); if (j) inbox.push({ type: j.type, todo: j.todo || null, choice: j.choice || null, qs: null }); }
    }
    if (!plan) for (const f of await S.fs.list(`${q}/inbox/done`)) {
      if (f.kind === 'file' && f.name.endsWith('-answers.json')) { const j = await readJSON(`${q}/inbox/done/${f.name}`); if (j && Array.isArray(j.answers)) inbox.push({ type: 'answers', todo: null, choice: null, qs: j.answers.map((a) => a.q) }); }
    }
    const knowledge = (await S.fs.list('knowledge')).some((x) => x.name === `${q}.md`);
    quests.push({ id: q, plan, request, draft, reports, output, inbox, knowledge });
  }
  quests.sort((a, b) => b.id.localeCompare(a.id));
  const knowledge = [];
  for (const e of await S.fs.list('knowledge')) if (e.kind === 'file' && e.name.endsWith('.md')) knowledge.push({ name: e.name, text: (await S.fs.readText(`knowledge/${e.name}`)) || '' });
  knowledge.sort((a, b) => b.name.localeCompare(a.name));
  const templates = (await S.fs.list('templates')).filter((e) => e.kind === 'file').map((e) => e.name).sort();
  return { requests, quests, knowledge, templates };
}

// ============================================================ 読み解き
const TSTATE = {
  pending: ['待機', 'sd-wait'], blocked: ['止まり', 'sd-stop'], awaiting_confirm: ['確認待ち', 'sd-turn'], running: ['作業中', 'sd-run'],
  waiting_user: ['あなたの番', 'sd-turn'], review: ['鑑定中', 'sd-run'], done: ['合格', 'sd-ok'], failed: ['できず', 'sd-ng'], skipped: ['やめた', 'sd-stop']
};
const closed = (s) => s === 'done' || s === 'skipped';

function dependents(plan, id) {
  const set = new Set([id]); let grew = true;
  while (grew) { grew = false; for (const t of plan.todos) if (!set.has(t.id) && (t.deps || []).some((d) => set.has(d))) { set.add(t.id); grew = true; } }
  set.delete(id); return plan.todos.filter((t) => set.has(t.id));
}

function derive(q) {
  const p = q.plan;
  const title = (p && p.title) || (q.request && String(q.request.text || '').split('\n')[0].slice(0, 80)) || q.id;
  const d = { id: q.id, title, asks: [], info: null, todos: [], done: 0, total: 0, finished: false, label: '', cls: '', me: '—', q };
  const inboxHas = (type, todo, choice) => q.inbox.some((x) => x.type === type && (todo == null || x.todo === todo) && (choice == null || x.choice === choice));
  if (!p) {
    const qs = q.draft && Array.isArray(q.draft.questions) ? q.draft.questions : [];
    if (qs.length) {
      d.asks.push({ kind: 'questions', key: `${q.id}:questions`, label: '質問', qs, sent: q.inbox.some((x) => x.type === 'answers' && (!x.qs || x.qs.join('|') === qs.map((y) => y.text).join('|'))) });
      d.label = d.asks[0].sent ? '分解中' : '質問あり'; d.cls = d.asks[0].sent ? 'sd-run' : 'sd-turn'; d.me = d.asks[0].sent ? '—' : '質問';
      return d;
    }
    d.label = '分解中'; d.cls = 'sd-run'; d.info = 'decomposing'; return d;
  }
  d.todos = p.todos.map((t) => {
    const st = TSTATE[t.state] || [t.state, 'sd-wait'];
    const draft = !p.approved && t.state === 'pending';
    return { ...t, stamp: draft ? '案' : st[0], cls: draft ? 'sd-draft' : st[1] };
  });
  d.total = p.todos.length; d.done = p.todos.filter((t) => closed(t.state)).length;
  d.allDone = d.total > 0 && d.done === d.total;
  d.finished = d.allDone && !!p.accepted;
  if (p.status === 'aborted') { d.label = '中止'; d.cls = 'sd-stop'; d.info = 'aborted'; return d; }
  if (p.status === 'replan') { d.label = '計画を直し中'; d.cls = 'sd-run'; d.info = 'replan'; return d; }
  if (!p.approved) {
    d.asks.push({ kind: 'approve', key: `${q.id}:approve`, label: '承認', sent: inboxHas('approve') || inboxHas('decision', null, 'replan') || inboxHas('decision', null, 'abort') });
  } else {
    for (const t of p.todos) {
      if (t.state === 'awaiting_confirm') d.asks.push({ kind: 'confirm', todo: t, key: `${q.id}:${t.id}:confirm`, label: `${t.id}（確認）`, sent: inboxHas('confirm', t.id) });
      if (t.state === 'waiting_user') d.asks.push({ kind: 'result', todo: t, key: `${q.id}:${t.id}:result`, label: t.id, sent: inboxHas('result', t.id) });
      if (t.state === 'failed') d.asks.push({ kind: 'decision', todo: t, key: `${q.id}:${t.id}:decision`, label: `${t.id}（判断）`, sent: inboxHas('decision', t.id) || inboxHas('decision', null, 'replan') || inboxHas('decision', null, 'abort') });
    }
  }
  if (p.approved && d.allDone && !p.accepted) d.asks.push({ kind: 'accept', key: `${q.id}:accept`, label: '受け取り', sent: inboxHas('accept') || inboxHas('decision', null, 'replan') || inboxHas('decision', null, 'abort') });
  const waiting = d.asks.filter((a) => !a.sent);
  if (d.finished) { d.label = '完了'; d.cls = 'sd-ok'; }
  else if (waiting.some((a) => a.kind === 'decision')) { d.label = '要判断'; d.cls = 'sd-ng'; }
  else if (!p.approved) { d.label = '承認待ち'; d.cls = 'sd-draft'; }
  else if (waiting.some((a) => a.kind === 'accept')) { d.label = '受け取り待ち'; d.cls = 'sd-turn'; }
  else if (waiting.length) { d.label = '進行中'; d.cls = 'sd-turn'; }
  else { d.label = '進行中'; d.cls = 'sd-run'; }
  d.me = waiting.length ? waiting.map((a) => a.label).join('・') : '—';
  if (d.finished) d.info = 'finished';
  return d;
}

function buildModel(raw) {
  const quests = raw.quests.map(derive);
  return { requests: raw.requests, knowledge: raw.knowledge, templates: raw.templates, quests, needs: quests.flatMap((x) => x.asks.filter((a) => !a.sent).map((a) => ({ q: x.id, text: `${x.id}：${askText(x, a)}` }))) };
}
function askText(x, a) {
  if (a.kind === 'approve') return '計画の承認';
  if (a.kind === 'accept') return '納品物の受け取り確認';
  if (a.kind === 'questions') return '依頼についての質問';
  if (a.kind === 'confirm') return `${a.todo.id}「${a.todo.title}」の実行前の確認`;
  if (a.kind === 'result') return `${a.todo.id}「${a.todo.title}」`;
  return `${a.todo.id} ができなかったため、進め方の判断`;
}

// ---- 会話の材料と、タイムラインの帯
function roleOf(kind) { return { gm: ['受', 'マスター', 'gm'], cart: ['地', '地図師', 'cart'], adv: ['冒', '冒険者', 'adv'], app: ['鑑', '鑑定士', 'app'], me: ['君', 'あなた', 'me'] }[kind]; }
function messagesOf(q) {
  const p = q.q.plan; if (!p) return [];
  const has = (n) => q.q.reports.includes(n);
  const out = [];
  const kindOf = {}; p.todos.forEach((t) => { kindOf[t.id] = t.kind; });
  const add = (h0, role, text, report, note) => out.push({ q: q.id, t: h0.t, role, text, report: report && has(report.split('/').pop()) ? report : '', note: !!note });
  for (const e of p.history || []) {
    const id = e.id;
    if (e.event === 'adopted') add(e, 'cart', `${p.todos.length}つの Todo に分けました。`, 'reports/plan-draft.json');
    else if (e.event === 'approved') add(e, 'me', '計画を承認しました。');
    else if (e.event === 'accepted') add(e, 'me', '納品物を受け取りました。');
    else if (e.event === 'replanned') add(e, 'cart', `計画を作り直しました（引き継いだ Todo：${(e.carried || []).join('、') || 'なし'}）。`, 'reports/plan-draft.json');
    else if (e.event === 'decision') add(e, 'me', e.choice === 'abort' ? '依頼を中止しました。' : '計画を直すよう頼みました。' + (e.comment ? `（${e.comment}）` : ''));
    else if (e.event === 'deps_done') {
      if (e.to === 'waiting_user') add(e, 'gm', `${id} をあなたに渡しました。「掲示板」の手紙に、答える欄があります。`);
      else if (e.to === 'awaiting_confirm') add(e, 'gm', `${id} は実行前の確認待ちです。`);
      else add(e, 'gm', `${id} を冒険者に渡しました。`);
    }
    else if (e.event === 'dep_failed') add(e, 'gm', `${id} が止まりました（前提の Todo ができなかったため）。`);
    else if (e.event === 'unblock') add(e, 'gm', `${id} の止まりが解けました。`);
    else if (e.event === 'confirmed') add(e, 'me', `${id}：実行する、を選びました。`);
    else if (e.event === 'declined') add(e, 'me', `${id}：実行しない、を選びました。`);
    else if (e.event === 'submitted') { if (kindOf[id] === 'human') add(e, 'me', `${id}：できた（結果を送りました）。`, `reports/${id}-user.md`); else add(e, 'adv', `${id}：作業を終えました。`, `reports/${id}-adventurer.md`); }
    else if (e.event === 'reported_failed') add(e, 'me', `${id}：できなかった。`, `reports/${id}-user.md`);
    else if (e.event === 'passed') add(e, 'app', `${id}：合格。`, `reports/${id}-appraiser.md`);
    else if (e.event === 'rejected') add(e, 'app', `${id}：不合格です。${e.to === 'failed' ? 'やり直しの回数を超えました。' : 'やり直します。'}`, `reports/${id}-appraiser.md`, true);
    else if (e.event === 'skip') add(e, 'me', `${id}：やめました。`);
    else if (e.event === 'dropped') add(e, 'gm', `${id}：前提がやめられたため、やめました。`);
  }
  return out;
}

const BARKIND = { running: ['adv', '作業'], review: ['app', '鑑定'], waiting_user: ['me', 'あなたの番'], awaiting_confirm: ['conf', '確認待ち'], blocked: ['blk', '止まり'], failed: ['ng', 'できず'] };
function ganttOf(q) {
  const p = q.q.plan; if (!p || !(p.history || []).length) return null;
  const now = Date.now(), hist = p.history.map((e) => ({ ...e, ms: new Date(e.t).getTime() })).filter((e) => !isNaN(e.ms));
  const rows = [];
  const adopted = hist.find((e) => e.event === 'adopted'), approved = hist.find((e) => e.event === 'approved');
  let lo = hist[0].ms, hi = hist[hist.length - 1].ms, open = false;
  if (adopted) {
    const end = approved ? approved.ms : now; if (!approved) open = true;
    rows.push({ label: '分解・承認', sub: '地図師／あなた', bars: [{ kind: 'me', text: '承認待ち', a: adopted.ms, b: end }] });
    hi = Math.max(hi, end);
  }
  for (const t of p.todos) {
    const ev = hist.filter((e) => e.id === t.id && e.to);
    const bars = [];
    ev.forEach((e, i) => {
      const k = BARKIND[e.to]; if (!k) return;
      const nxt = ev[i + 1]; const end = nxt ? nxt.ms : now; if (!nxt) open = true;
      bars.push({ kind: k[0], text: k[1], a: e.ms, b: end }); hi = Math.max(hi, end);
    });
    rows.push({ label: t.id, sub: t.title.length > 14 ? t.title.slice(0, 14) + '…' : t.title, bars });
  }
  if (open) hi = Math.max(hi, now);
  const span = Math.max(hi - lo, 60000), pad2 = span * 0.04; lo -= 0; hi += pad2;
  const steps = [1, 2, 5, 10, 15, 30, 60, 120, 180, 360, 720, 1440, 2880, 10080].map((m) => m * 60000);
  const step = steps.find((s) => (hi - lo) / s <= 8) || steps[steps.length - 1];
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  return { rows, lo, hi, ticks, now: open ? now : null, long: hi - lo > 86400000 };
}

// ============================================================ 描画（部品）
function stampEl(label, cls) { return h('span', { class: `stamp ${cls}` }, label); }

function sentNote(key) {
  return S.sent[key] ? h('p', { class: 'saved', role: 'status' }, HANDOFF) : null;
}
function bindKey(el, key) { el.dataset.key = key; return el; }
function textarea(key, attrs) { const e = h('textarea', attrs); e.value = S.form[key] || ''; return bindKey(e, key); }
function radio(name, key, value, label, desc, warn, checkedDefault) {
  const cur = S.form[key] !== undefined ? S.form[key] : checkedDefault;
  const inp = h('input', { type: 'radio', name, value, checked: cur === value });
  bindKey(inp, key);
  return h('label', { class: 'opt' }, inp, h('span', null, h('b', null, label), desc ? h('span', { class: 'd' }, desc) : null, warn ? h('span', { class: 'warnline' }, warn) : null));
}
function check(key, value, label, checkedList) {
  const cur = S.form[key] !== undefined ? S.form[key] : checkedList;
  const inp = h('input', { type: 'checkbox', value, checked: cur.includes(value) });
  bindKey(inp, key);
  return h('label', { class: 'opt' }, inp, h('span', null, h('b', null, label)));
}
const asList = (v) => (Array.isArray(v) ? v : v ? [v] : []);
function answerOf(x, form, k, i) {
  const key = `${k}:q${i}`, note = (form[`${k}:n${i}`] || '').trim();
  if (x.multi) { const a = form[key] !== undefined ? form[key] : asList(x.recommended); return { q: x.text, choice: a.join('、'), choices: a, note }; }
  return { q: x.text, choice: form[key] !== undefined ? form[key] : (x.recommended || ''), note };
}
// 納品物は、依頼主に渡す資料（地図師が deliverable の印を付けた Todo の成果物）。途中の成果物は材料
function deliverables(qd) {
  const p = qd.q.plan, all = qd.q.output;
  const ids = p ? p.todos.filter((t) => t.deliverable).map((t) => t.id) : [];
  if (!ids.length) return { main: all, rest: [] };
  const mine = (f) => ids.some((i) => f.startsWith(`${qd.id}/output/${i}/`));
  return { main: all.filter(mine), rest: all.filter((f) => !mine(f)) };
}
function fileRow(f, label) {
  return h('li', null, h('a', { href: '#', onclick: (e) => { e.preventDefault(); openFile(f); } }, label || f.replace(/^Q\d+\/output\//, '')),
    h('span', { class: 'acts' },
      h('button', { type: 'button', class: 'btn ghost sm', 'aria-label': `${f} を開く`, onclick: () => openFile(f) }, '開く'),
      h('button', { type: 'button', class: 'btn ghost sm', 'aria-label': `${f} のパスをコピー`, onclick: () => copyText('guild/' + f, 'パス') }, 'パスをコピー')));
}
function deliverableBlock(qd) {
  const d = deliverables(qd), fmt = FORMATS.find((x) => x.key === ((qd.q.plan && qd.q.plan.format) || 'md'));
  return [
    d.main.length ? h('ul', { class: 'flist' }, d.main.map(fileRow)) : h('p', null, '納品物のファイルはありません（報告だけです）。'),
    fmt ? h('p', { class: 'fine', style: 'margin:0 0 8px' }, `形式：${fmt.label}（${fmt.ext}）　パスは、プロジェクトのフォルダからの位置です。`) : null,
    d.rest.length ? h('details', null, h('summary', null, `途中の資料（材料）を見る（${d.rest.length}件）`), h('ul', { class: 'flist' }, d.rest.map(fileRow))) : null];
}
function fileField(key, label, multiple) {
  const inp = h('input', { type: 'file', 'aria-label': label }); if (multiple) inp.multiple = true;
  inp.dataset.fileKey = key;
  const cur = S.files[key] || [];
  const zone = h('label', { class: 'filebtn dz' },
    h('span', { class: 'dzmsg' }, cur.length ? 'ここにドロップして、追加・差し替え' : 'ここにファイルをドラッグ＆ドロップ、または'),
    h('span', { class: 'dzlink' }, cur.length ? '選び直す' : 'ファイルを選ぶ'), inp);
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault(); zone.classList.remove('over');
    const got = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (!got.length) return;
    S.files[key] = multiple ? [...(S.files[key] || []), ...got] : got.slice(0, 1);
    render();
  });
  const chips = cur.map((f, i) => h('span', { class: 'chip' }, f.name, h('button', { type: 'button', class: 'chipx', 'aria-label': `${f.name} を外す`, onclick: () => { S.files[key] = (S.files[key] || []).filter((_, n) => n !== i); render(); } }, '×')));

function nowName(type, todo) { return `${stamp14(new Date())}-${type}${todo ? '-' + todo : ''}.json`; }

  catch (e) { S.fallback = { path: `guild/${path}`, text, err: `${e.name || 'エラー'}：${e.message || e}` }; render(); return false; }
}
async function send(qid, obj, key) {

function isEditing() {
  if (S.composing) return true;
  const ae = document.activeElement;
  const field = ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'radio' && ae.type !== 'checkbox' && ae.type !== 'file'));
  return !!field && Date.now() - S.lastInput < 10000;
}
async function refresh(force) {
  if (S.conn !== 'ok' || S.busy) return;
  S.busy = true;
  try {
    const raw = await loadAll(); const key = JSON.stringify(raw);
    // 入力中（変換中を含む）は画面を作り直さない。作り直すと、変換が確定せず、位置も動く。入力が止まった次の更新で反映する
    // 資料を開いている間も作り直さない（読んでいる位置が上に戻ってしまう）。閉じたあとの次の更新で反映する
    if (!force && key !== S.dataKey && (isEditing() || S.reader || S.fallback)) return;
    if (force || key !== S.dataKey) {
      S.dataKey = key; S.model = buildModel(raw);
      const ids = S.model.quests.map((x) => x.id);
      if (!S.openInit && ids.length) { S.openInit = true; const f0 = S.model.quests.find((x) => x.asks.some((a) => !a.sent)) || S.model.quests[0]; if (f0) S.openQ[f0.id] = true; }

      if (!S.tq || (S.tq !== 'all' && !ids.includes(S.tq))) S.tq = S.sel;
      render();
    }
  } catch (e) { S.connMsg = `読み込めませんでした（${e.name || 'エラー'}：${e.message || e}）。`; S.conn = 'error'; render(); }
  finally { S.busy = false; }
}
async function useHandle(handle) {
  let dir = handle;
  if (handle.name !== 'guild') {
    try { dir = await handle.getDirectoryHandle('guild'); }
    catch (e) { S.conn = 'none'; S.connMsg = `選んだフォルダに guild/ がありません。チャットで /guild:init を先に実行してください。（選んだ場所：${handle.name}）`; render(); return false; }
  }
  S.fs = new RealFS(dir); S.conn = 'ok'; S.connMsg = ''; S.dataKey = ''; await refresh(true); return true;
}

  return {

    requests: { 'R20261010-112800.json': J({ type: 'request', text: '社内の議事録テンプレートを見直してほしい', due: null, files: [] }) },
    Q001: { 'plan.json': J(p1), 'request.json': J({ text: 'notes.txt の要点を3行にまとめて、上司の了承をもらったあとで公開したい' }), reports: rep, output: { T1: { 'digest.md': T('- 見本') }, T3: { '公開用まとめ.md': T('# 見本の資料 - 結論から書く') } }, inbox: {} },
    Q002: { 'plan.json': J(p2), reports: { 'T1-appraiser.md': T('見本') }, output: { T3: { 'comparison.md': T('見本') } }, inbox: {} }
  };
}

// ============================================================ 起動
async function start() {
  try { history.scrollRestoration = 'manual'; } catch (e) { /* 使えなくても続ける */ }
  const params = new URLSearchParams(location.search);
  for (const ev of ['dragover', 'drop']) document.addEventListener(ev, (e) => { if (!e.target.closest || !e.target.closest('.dz')) e.preventDefault(); });
  document.addEventListener('compositionstart', () => { S.composing = true; });
  document.addEventListener('compositionend', () => { S.composing = false; S.lastInput = Date.now(); const k = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.key; if (k && k.startsWith('f:')) { S.form[k] = document.activeElement.value; render(); } });
  document.addEventListener('input', (e) => {
    S.lastInput = Date.now();
    const k = e.target.dataset && e.target.dataset.key;
    if (k && e.target.type !== 'radio' && e.target.type !== 'checkbox') S.form[k] = e.target.value;
    if (k === 'new:format' || (k && k.startsWith('f:') && !S.composing)) render();
  });
  document.addEventListener('change', (e) => {
    const t = e.target, k = t.dataset && t.dataset.key;
    if (k && t.type === 'radio') S.form[k] = t.value;
    if (k && t.type === 'checkbox') S.form[k] = Array.from(document.querySelectorAll('input[type=checkbox]')).filter((c) => c.dataset.key === k && c.checked).map((c) => c.value);
    if (k && t.type === 'date') S.form[k] = t.value;
    if (t.dataset && t.dataset.fileKey) { S.files[t.dataset.fileKey] = Array.from(t.files || []); render(); }
  });
  window.__guildBoard = { S, render, refresh, MemFS, useFS: async (fs, demo) => { S.fs = fs; S.conn = 'ok'; S.demo = !!demo; S.dataKey = ''; await refresh(true); } };
  if (params.has('demo')) {
    S.demo = true; S.fs = new MemFS(demoTree(params.get('demo') || 'human')); S.conn = 'ok'; await refresh(true); return;
  }
  if (!window.showDirectoryPicker) { S.conn = 'unsupported'; render(); return; }
  render();
  try {
    const handle = await DB.get();
    if (handle) {
      S.handle = handle;
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') await useHandle(handle); else { S.conn = 'need-permission'; render(); }
    }
  } catch (e) { S.connMsg = `前に選んだフォルダを読み出せませんでした（${e.name || 'エラー'}：${e.message || e}）。`; render(); }
  setInterval(() => { if (!document.hidden) refresh(false); }, 3000);
}
start();
})();
